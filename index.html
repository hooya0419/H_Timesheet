<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // ---------------------------------------------------------------
  // window.storage 셰임(shim)
  // 원래 이 앱은 Claude 아티팩트 전용 저장소(window.storage)를 씁니다.
  //
  //  - "개인" 저장(shared=false, 예: 로그인 세션)은 이 기기의 localStorage에만
  //    남아요. 원래도 기기별로 따로 유지되는 게 맞는 데이터라 그대로 뒀어요.
  //  - "공유" 저장(shared=true, 본부/팀원/프로젝트/업무/기록 전체)은 이제
  //    Supabase의 app_storage 테이블에 저장돼서, 다른 기기/다른 사람이 열어도
  //    같은 데이터를 보고 씁니다. (약 8초마다 자동으로 새로고침돼요)
  // ---------------------------------------------------------------
  (function () {
    if (window.storage) return;

    var SUPABASE_URL = "https://juedjxapzmbwdlguecau.supabase.co";
    var SUPABASE_KEY = "sb_publishable_rAQ73VKd9CSeDROf56Doxw_y-CnKs2q";
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var PREFIX = "ts-app-storage";
    function fullKey(key, shared) {
      return PREFIX + ":" + (shared ? "shared" : "personal") + ":" + key;
    }

    window.storage = {
      get: async function (key, shared) {
        shared = !!shared;
        if (!shared) {
          var raw = localStorage.getItem(fullKey(key, false));
          if (raw === null) throw new Error("storage key not found: " + key);
          return { key: key, value: raw, shared: false };
        }
        var res = await sb.from("app_storage").select("value").eq("key", key).maybeSingle();
        if (res.error) throw res.error;
        if (!res.data) throw new Error("storage key not found: " + key);
        return { key: key, value: JSON.stringify(res.data.value), shared: true };
      },

      set: async function (key, value, shared) {
        shared = !!shared;
        if (!shared) {
          localStorage.setItem(fullKey(key, false), value);
          return { key: key, value: value, shared: false };
        }
        var parsed = JSON.parse(value);
        var res = await sb.from("app_storage").upsert({ key: key, value: parsed, updated_at: new Date().toISOString() });
        if (res.error) throw res.error;
        return { key: key, value: value, shared: true };
      },

      delete: async function (key, shared) {
        shared = !!shared;
        if (!shared) {
          var existed = localStorage.getItem(fullKey(key, false)) !== null;
          localStorage.removeItem(fullKey(key, false));
          return { key: key, deleted: existed, shared: false };
        }
        var res = await sb.from("app_storage").delete().eq("key", key);
        if (res.error) throw res.error;
        return { key: key, deleted: true, shared: true };
      },

      list: async function (prefix, shared) {
        prefix = prefix || "";
        shared = !!shared;
        if (!shared) {
          var searchPrefix = fullKey(prefix, false);
          var base = fullKey("", false);
          var keys = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf(searchPrefix) === 0) keys.push(k.slice(base.length));
          }
          return { keys: keys, prefix: prefix, shared: false };
        }
        var res = await sb.from("app_storage").select("key").like("key", prefix + "%");
        if (res.error) throw res.error;
        return { keys: res.data.map(function (r) { return r.key; }), prefix: prefix, shared: true };
      },
    };
  })();
</script>

function uid() {
  return Math.random().toString(36).slice(2, 10);
}
function pad(n) {
  return String(n).padStart(2, "0");
}
function toKey(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function startOfWeek(d) {
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7;
  date.setDate(date.getDate() - day);
  date.setHours(0, 0, 0, 0);
  return date;
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function fmtHM(mins) {
  const m = Math.max(0, Math.round(mins));
  const h = Math.floor(m / 60);
  const mm = m % 60;
  return `${h}:${pad(mm)}`;
}
const TIME_OPTIONS = Array.from({ length: 144 }, (_, i) => i * 10); // 자정부터 10분 단위, 0~1430
function fmtTime(mins) {
  if (mins === undefined || mins === null) return "";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `${pad(h)}:${pad(m)}`;
}
function monthDay(d) {
  return d.toLocaleDateString("ko-KR", { month: "short", day: "numeric" });
}
function weekdayShort(d) {
  return d.toLocaleDateString("ko-KR", { weekday: "short" });
}
function isSameDay(a, b) {
  return toKey(a) === toKey(b);
}
function eventOccursOn(event, key) {
  if (event.allDay) return key >= event.dateKey && key <= (event.endDateKey || event.dateKey);
  return event.dateKey === key;
}
function dateRangeDays(startKey, endKey) {
  const [sy, sm, sd] = startKey.split("-").map(Number);
  const [ey, em, ed] = endKey.split("-").map(Number);
  const start = new Date(sy, sm - 1, sd);
  const end = new Date(ey, em - 1, ed);
  const days = Math.round((end - start) / 86400000) + 1;
  return Math.max(1, days);
}
function parseDateKey(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function initials(name) {
  if (!name) return "?";
  const trimmed = name.trim();
  if (/[\uAC00-\uD7A3]/.test(trimmed)) return trimmed[0];
  return trimmed.slice(0, 2).toUpperCase();
}

function TimesheetApp() {
  const [loaded, setLoaded] = useState(false);
  const [departments, setDepartments] = useState(DEFAULT_DEPARTMENTS);
  const [projects, setProjects] = useState(DEFAULT_PROJECTS);
  const [members, setMembers] = useState(DEFAULT_MEMBERS);
  const [tasks, setTasks] = useState(DEFAULT_TASKS);
  const [worklogs, setWorklogs] = useState([
    { id: "w1", taskId: "t1", memberId: "m2", departmentId: "d1", dateKey: toKey(new Date()), startMinutes: 540, endMinutes: 630, minutes: 90, note: "" },
  ]);
  const [events, setEvents] = useState([
    { id: "e1", categoryId: "client", title: "1차 실시설계 협의", memberId: "m1", departmentId: "d1", dateKey: toKey(new Date()), startMinutes: 660, endMinutes: 720, note: "", allDay: false },
  ]);
  const [leaves, setLeaves] = useState([
    { id: "l1", typeId: "vacation", memberId: "m3", departmentId: "d1", startDateKey: toKey(addDays(new Date(), 2)), endDateKey: toKey(addDays(new Date(), 3)), note: "" },
  ]);
  const [session, setSession] = useState(null);

  const [tab, setTab] = useState("timesheet"); // timesheet | board | projects | profile
  const [selectedDate, setSelectedDate] = useState(() => new Date());
  const [taskModal, setTaskModal] = useState(null); // {mode:'create'|'edit', task}
  const [worklogModal, setWorklogModal] = useState(null); // {mode:'create'|'edit', worklog}
  const [eventModal, setEventModal] = useState(null); // {mode:'create'|'edit', event}
  const [leaveModal, setLeaveModal] = useState(null); // {mode:'create'|'edit', leave}
  const [pendingDelete, setPendingDelete] = useState(null);
  const [newProjectOpen, setNewProjectOpen] = useState(false);
  const [draftProject, setDraftProject] = useState({ name: "", client: "", color: PALETTE[0] });
  const [syncing, setSyncing] = useState(false);
  const [projectDetailId, setProjectDetailId] = useState(null);
  const [viewingDepartmentId, setViewingDepartmentId] = useState(null); // 최고 관리자가 전환해서 볼 본부

  async function loadShared() {
    try {
      const res = await window.storage.get(SHARED_KEY, true);
      if (res && res.value) {
        const data = JSON.parse(res.value);
        if (Array.isArray(data.departments) && data.departments.length) setDepartments(data.departments);
        if (Array.isArray(data.projects) && data.projects.length) setProjects(data.projects);
        if (Array.isArray(data.members) && data.members.length) setMembers(data.members);
        if (Array.isArray(data.tasks)) setTasks(data.tasks);
        if (Array.isArray(data.worklogs)) setWorklogs(data.worklogs);
        if (Array.isArray(data.events)) setEvents(data.events);
        if (Array.isArray(data.leaves)) setLeaves(data.leaves);
      }
    } catch (e) {
      // 아직 공유 데이터가 없음
    }
  }

  useEffect(() => {
    (async () => {
      await loadShared();
      try {
        const res = await window.storage.get(SESSION_KEY, false);
        if (res && res.value) {
          const s = JSON.parse(res.value);
          if (s.memberId) setSession(s.memberId);
        }
      } catch (e) {
        // 로그인된 세션 없음
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        await window.storage.set(SHARED_KEY, JSON.stringify({ departments, projects, members, tasks, worklogs, events, leaves }), true);
      } catch (e) {
        console.error("저장 실패", e);
      }
    })();
  }, [departments, projects, members, tasks, worklogs, events, leaves, loaded]);

  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        await window.storage.set(SESSION_KEY, JSON.stringify({ memberId: session }), false);
      } catch (e) {
        console.error("세션 저장 실패", e);
      }
    })();
  }, [session, loaded]);

  useEffect(() => {
    if (!loaded || !session) return;
    const id = setInterval(() => loadShared(), POLL_MS);
    return () => clearInterval(id);
  }, [loaded, session]);

  const projectById = useMemo(() => {
    const map = {};
    projects.forEach((p) => (map[p.id] = p));
    return map;
  }, [projects]);

  const memberById = useMemo(() => {
    const map = {};
    members.forEach((m) => (map[m.id] = m));
    return map;
  }, [members]);

  const departmentById = useMemo(() => {
    const map = {};
    departments.forEach((d) => (map[d.id] = d));
    return map;
  }, [departments]);

  const currentMember = session ? memberById[session] : null;
  const isSuper = currentMember?.role === "super";

  // 최고 관리자는 본부를 전환해서 볼 수 있고, 그 외에는 자기 본부로 고정
  const scopedDepartmentId = isSuper ? viewingDepartmentId : currentMember?.departmentId || null;

  useEffect(() => {
    if (isSuper && !viewingDepartmentId && departments[0]) setViewingDepartmentId(departments[0].id);
  }, [isSuper, viewingDepartmentId, departments]);

  const scopedProjects = useMemo(() => projects.filter((p) => p.departmentId === scopedDepartmentId), [projects, scopedDepartmentId]);
  const scopedTasks = useMemo(() => tasks.filter((t) => t.departmentId === scopedDepartmentId), [tasks, scopedDepartmentId]);
  const scopedWorklogs = useMemo(() => worklogs.filter((w) => w.departmentId === scopedDepartmentId), [worklogs, scopedDepartmentId]);
  const scopedEvents = useMemo(() => events.filter((e) => e.departmentId === scopedDepartmentId), [events, scopedDepartmentId]);
  const scopedLeaves = useMemo(() => leaves.filter((l) => l.departmentId === scopedDepartmentId), [leaves, scopedDepartmentId]);
  const scopedMembers = useMemo(() => members.filter((m) => m.departmentId === scopedDepartmentId), [members, scopedDepartmentId]);
  const scopedProjectById = useMemo(() => {
    const map = {};
    scopedProjects.forEach((p) => (map[p.id] = p));
    return map;
  }, [scopedProjects]);
  const scopedMemberById = useMemo(() => {
    const map = {};
    scopedMembers.forEach((m) => (map[m.id] = m));
    return map;
  }, [scopedMembers]);

  function handleLogin(memberId) {
    setSession(memberId);
  }
  function handleSignup({ name, username, password, color, departmentId }) {
    const newMember = { id: uid(), name, username, password, color, role: "member", departmentId, position: "" };
    setMembers((prev) => [...prev, newMember]);
    setSession(newMember.id);
  }
  function handleBootstrapSuper({ name, username, password, color }) {
    const newMember = { id: uid(), name, username, password, color, role: "super", departmentId: null, position: "" };
    setMembers((prev) => [...prev, newMember]);
    setSession(newMember.id);
  }
  function handleLogout() {
    setSession(null);
  }

  function canManageDept(deptId) {
    if (!currentMember) return false;
    if (currentMember.role === "super") return true;
    return currentMember.role === "admin" && currentMember.departmentId === deptId;
  }

  function toggleRole(memberId) {
    const target = memberById[memberId];
    if (!target || target.role === "super") return; // 최고 관리자 권한은 여기서 바꾸지 않음
    if (!canManageDept(target.departmentId)) return;
    const deptAdminCount = members.filter((m) => m.departmentId === target.departmentId && m.role === "admin").length;
    if (target.role === "admin" && deptAdminCount <= 1) return; // 본부의 마지막 관리자는 해제할 수 없음
    setMembers((prev) => prev.map((m) => (m.id === memberId ? { ...m, role: m.role === "admin" ? "member" : "admin" } : m)));
  }

  function deleteMember(memberId) {
    const target = memberById[memberId];
    if (!target || target.role === "super") return; // 최고 관리자는 여기서 삭제하지 않음
    if (!canManageDept(target.departmentId)) return;
    if (target.role === "admin") {
      const deptAdminCount = members.filter((m) => m.departmentId === target.departmentId && m.role === "admin").length;
      if (deptAdminCount <= 1) return; // 본부의 마지막 관리자는 삭제할 수 없음
    }
    setMembers((prev) => prev.filter((m) => m.id !== memberId));
    setPendingDelete(null);
  }

  function addDepartment(name) {
    if (!isSuper) return;
    const trimmed = name.trim();
    if (!trimmed) return;
    const dept = { id: uid(), name: trimmed };
    setDepartments((prev) => [...prev, dept]);
    setViewingDepartmentId(dept.id);
  }

  function deleteDepartment(id) {
    if (!isSuper) return;
    setDepartments((prev) => prev.filter((d) => d.id !== id));
    setMembers((prev) => prev.filter((m) => m.departmentId !== id));
    setProjects((prev) => prev.filter((p) => p.departmentId !== id));
    setTasks((prev) => prev.filter((t) => t.departmentId !== id));
    setWorklogs((prev) => prev.filter((w) => w.departmentId !== id));
    setEvents((prev) => prev.filter((e) => e.departmentId !== id));
    setLeaves((prev) => prev.filter((l) => l.departmentId !== id));
    setViewingDepartmentId((prev) => (prev === id ? null : prev));
    setPendingDelete(null);
  }

  function reassignDepartment(memberId, newDepartmentId) {
    if (!isSuper) return;
    setMembers((prev) =>
      prev.map((m) => {
        if (m.id !== memberId || m.role === "super") return m;
        if (m.departmentId === newDepartmentId) return m;
        // 본부가 바뀌면 이전 본부의 관리자 권한은 초기화돼요
        return { ...m, departmentId: newDepartmentId, role: m.role === "admin" ? "member" : m.role };
      })
    );
  }

  function updateProfile({ name, position }) {
    if (!session) return { ok: false, error: "로그인이 필요해요." };
    const trimmed = name.trim();
    if (!trimmed) return { ok: false, error: "이름을 입력해주세요." };
    const dup = members.some((m) => m.id !== session && m.name.toLowerCase() === trimmed.toLowerCase());
    if (dup) return { ok: false, error: "이미 사용 중인 이름이에요." };
    setMembers((prev) => prev.map((m) => (m.id === session ? { ...m, name: trimmed, position: position.trim() } : m)));
    return { ok: true };
  }

  function changePassword({ currentPassword, newPassword, newPassword2 }) {
    if (!session) return { ok: false, error: "로그인이 필요해요." };
    const me = memberById[session];
    if (!me || me.password !== currentPassword) return { ok: false, error: "현재 비밀번호가 올바르지 않아요." };
    if (!newPassword || newPassword.length < 4) return { ok: false, error: "새 비밀번호는 4자 이상으로 설정해주세요." };
    if (newPassword !== newPassword2) return { ok: false, error: "새 비밀번호가 서로 일치하지 않아요." };
    setMembers((prev) => prev.map((m) => (m.id === session ? { ...m, password: newPassword } : m)));
    return { ok: true };
  }

  function saveTask(task) {
    setTasks((prev) => {
      const exists = prev.some((t) => t.id === task.id);
      if (exists) return prev.map((t) => (t.id === task.id ? task : t));
      return [task, ...prev];
    });
    setTaskModal(null);
  }
  function deleteTask(id) {
    setTasks((prev) => prev.filter((t) => t.id !== id));
    setWorklogs((prev) => prev.filter((w) => w.taskId !== id));
    setPendingDelete(null);
  }
  function setTaskStatus(taskId, status) {
    setTasks((prev) => prev.map((t) => (t.id === taskId ? { ...t, status } : t)));
  }

  function saveWorklog(worklog) {
    if (worklog.memberId !== session) return;
    setWorklogs((prev) => {
      const exists = prev.some((w) => w.id === worklog.id);
      if (exists) return prev.map((w) => (w.id === worklog.id ? worklog : w));
      return [worklog, ...prev];
    });
    setWorklogModal(null);
  }
  function deleteWorklog(id) {
    setWorklogs((prev) => prev.filter((w) => !(w.id === id && w.memberId === session)));
    setPendingDelete(null);
  }

  function saveEvent(event) {
    if (event.memberId !== session) return;
    setEvents((prev) => {
      const exists = prev.some((e) => e.id === event.id);
      if (exists) return prev.map((e) => (e.id === event.id ? event : e));
      return [event, ...prev];
    });
    setEventModal(null);
  }
  function deleteEvent(id) {
    setEvents((prev) => prev.filter((e) => !(e.id === id && e.memberId === session)));
    setPendingDelete(null);
  }

  function saveLeave(leave) {
    if (leave.memberId !== session) return;
    setLeaves((prev) => {
      const exists = prev.some((l) => l.id === leave.id);
      if (exists) return prev.map((l) => (l.id === leave.id ? leave : l));
      return [leave, ...prev];
    });
    setLeaveModal(null);
  }
  function deleteLeave(id) {
    setLeaves((prev) => prev.filter((l) => !(l.id === id && l.memberId === session)));
    setPendingDelete(null);
  }

  function addProject() {
    if (!draftProject.name.trim() || !scopedDepartmentId) return;
    const proj = { id: uid(), name: draftProject.name.trim(), client: draftProject.client.trim(), color: draftProject.color, departmentId: scopedDepartmentId };
    setProjects((prev) => [...prev, proj]);
    setDraftProject({ name: "", client: "", color: PALETTE[0] });
    setNewProjectOpen(false);
  }
  function deleteProject(id) {
    setProjects((prev) => prev.filter((p) => p.id !== id));
    setPendingDelete(null);
  }

  async function manualSync() {
    setSyncing(true);
    await loadShared();
    setTimeout(() => setSyncing(false), 400);
  }

  const worklogTotalByTask = useMemo(() => {
    const map = {};
    scopedWorklogs.forEach((w) => {
      map[w.taskId] = (map[w.taskId] || 0) + w.minutes;
    });
    return map;
  }, [scopedWorklogs]);

  if (!loaded) {
    return (
      <div className="ts-loading">
        <Loader2 className="spin" size={20} />
        <span>불러오는 중…</span>
        <Styles />
      </div>
    );
  }

  if (!session) {
    return (
      <div className="ts-root">
        <Styles />
        <AuthScreen departments={departments} members={members} onLogin={handleLogin} onSignup={handleSignup} onBootstrapSuper={handleBootstrapSuper} />
      </div>
    );
  }

  return (
    <div className="ts-root">
      <Styles />

      <header className="ts-header">
        <div className="ts-brand">
          <img src={LOGO_SRC} alt="행림" className="ts-brand-logo" />
        </div>
        {isSuper ? (
          <select className="ts-select ts-dept-switch" value={viewingDepartmentId || ""} onChange={(e) => setViewingDepartmentId(e.target.value)}>
            {departments.length === 0 && <option value="">등록된 본부 없음</option>}
            {departments.map((d) => (
              <option key={d.id} value={d.id}>
                {d.name}
              </option>
            ))}
          </select>
        ) : (
          <span className="ts-dept-badge">{departmentById[currentMember?.departmentId]?.name || "본부 미지정"}</span>
        )}
        <nav className="ts-nav-desktop">
          {["timesheet", "schedule", "board", "projects", "team", "profile"].map((t) => (
            <button key={t} className={`ts-nav-btn ${tab === t ? "active" : ""}`} onClick={() => setTab(t)}>
              {t === "timesheet"
                ? "타임시트"
                : t === "schedule"
                ? "일정"
                : t === "board"
                ? "보드"
                : t === "projects"
                ? "프로젝트"
                : t === "team"
                ? "팀원"
                : "내 정보"}
            </button>
          ))}
        </nav>
        <div className="ts-header-user">
          <MemberAvatar member={currentMember} size={26} />
          <span className="ts-header-username">
            {currentMember?.name}
            {currentMember?.role !== "member" && <span className="ts-admin-badge">{ROLE_LABEL[currentMember?.role]}</span>}
          </span>
          <button className="ts-icon-btn" onClick={handleLogout} aria-label="로그아웃">
            <LogOut size={15} />
          </button>
        </div>
      </header>

      <main className="ts-main">
        {!scopedDepartmentId ? (
          <div className="ts-card ts-list-card">
            <EmptyState label={isSuper ? "먼저 상단에서 본부를 만들거나 선택해주세요." : "소속된 본부가 없어요. 관리자에게 문의해주세요."} />
          </div>
        ) : (
          <>
            {tab === "timesheet" && (
              <TimesheetTab
                selectedDate={selectedDate}
                setSelectedDate={setSelectedDate}
                worklogs={scopedWorklogs}
                events={scopedEvents}
                tasks={scopedTasks}
                members={scopedMembers}
                memberById={scopedMemberById}
                projectById={scopedProjectById}
                session={session}
                onEdit={(worklog) => setWorklogModal({ mode: "edit", worklog })}
                onCreate={(dateKey) =>
                  setWorklogModal({
                    mode: "create",
                    worklog: { id: uid(), taskId: scopedTasks[0]?.id || "", memberId: session, departmentId: scopedDepartmentId, dateKey, startMinutes: 540, endMinutes: 600, note: "" },
                  })
                }
                onEditEvent={(event) => setEventModal({ mode: "edit", event })}
                onCreateEvent={(dateKey) =>
                  setEventModal({
                    mode: "create",
                    event: { id: uid(), categoryId: EVENT_CATEGORIES[0].id, title: "", memberId: session, departmentId: scopedDepartmentId, dateKey, startMinutes: 600, endMinutes: 660, allDay: false, note: "" },
                  })
                }
              />
            )}

            {tab === "schedule" && (
              <ScheduleTab
                leaves={scopedLeaves}
                members={scopedMembers}
                memberById={scopedMemberById}
                session={session}
                onNew={() =>
                  setLeaveModal({
                    mode: "create",
                    leave: { id: uid(), typeId: LEAVE_TYPES[0].id, memberId: session, departmentId: scopedDepartmentId, startDateKey: toKey(new Date()), endDateKey: toKey(new Date()), note: "" },
                  })
                }
                onEdit={(leave) => setLeaveModal({ mode: "edit", leave })}
              />
            )}

            {tab === "board" && (
              <BoardTab
                tasks={scopedTasks}
                members={scopedMembers}
                memberById={scopedMemberById}
                projects={scopedProjects}
                projectById={scopedProjectById}
                worklogTotalByTask={worklogTotalByTask}
                session={session}
                isAdmin={isSuper || currentMember?.role === "admin"}
                onNewTask={() =>
                  setTaskModal({
                    mode: "create",
                    task: { id: uid(), title: "", projectId: scopedProjects[0]?.id || "", departmentId: scopedDepartmentId, assigneeId: session, status: "todo", priority: "medium" },
                  })
                }
                onEditTask={(task) => setTaskModal({ mode: "edit", task })}
                onAskDeleteTask={(id) => setPendingDelete({ type: "task", id })}
                onSetStatus={setTaskStatus}
                onLogTime={(taskId) =>
                  setWorklogModal({
                    mode: "create",
                    worklog: { id: uid(), taskId, memberId: session, departmentId: scopedDepartmentId, dateKey: toKey(new Date()), startMinutes: 540, endMinutes: 600, note: "" },
                  })
                }
                pendingDelete={pendingDelete}
                onConfirmDeleteTask={deleteTask}
                onCancelDelete={() => setPendingDelete(null)}
                onSync={manualSync}
                syncing={syncing}
                onOpenDetail={(id) => setProjectDetailId(id)}
              />
            )}

            {tab === "projects" && (
              <ProjectsTab
                projects={scopedProjects}
                tasks={scopedTasks}
                worklogs={scopedWorklogs}
                onOpenDetail={(id) => setProjectDetailId(id)}
                newProjectOpen={newProjectOpen}
                setNewProjectOpen={setNewProjectOpen}
                draftProject={draftProject}
                setDraftProject={setDraftProject}
                onAdd={addProject}
                pendingDelete={pendingDelete}
                onAskDelete={(id) => setPendingDelete({ type: "project", id })}
                onConfirmDelete={deleteProject}
                onCancelDelete={() => setPendingDelete(null)}
              />
            )}

            {tab === "team" && (
              <TeamTab
                members={scopedMembers}
                currentMember={currentMember}
                onToggleRole={toggleRole}
                isSuper={isSuper}
                departments={departments}
                onAddDepartment={addDepartment}
                viewingDepartmentId={scopedDepartmentId}
                setViewingDepartmentId={setViewingDepartmentId}
                allMembers={members}
                onReassignDepartment={reassignDepartment}
                pendingDelete={pendingDelete}
                onAskDeleteMember={(id) => setPendingDelete({ type: "member", id })}
                onConfirmDeleteMember={deleteMember}
                onAskDeleteDepartment={(id) => setPendingDelete({ type: "department", id })}
                onCancelDelete={() => setPendingDelete(null)}
              />
            )}

            {tab === "profile" && (
              <ProfileTab
                currentMember={currentMember}
                departmentName={departmentById[currentMember?.departmentId]?.name}
                onSave={updateProfile}
                onChangePassword={changePassword}
              />
            )}
          </>
        )}
      </main>

      <nav className="ts-nav-mobile">
        {[
          { key: "timesheet", label: "타임시트", icon: Clock3 },
          { key: "schedule", label: "일정", icon: CalendarDays },
          { key: "board", label: "보드", icon: LayoutGrid },
          { key: "projects", label: "프로젝트", icon: FolderKanban },
          { key: "team", label: "팀원", icon: Users },
          { key: "profile", label: "내 정보", icon: Settings },
        ].map(({ key, label, icon: Icon }) => (
          <button key={key} className={`ts-nav-mobile-btn ${tab === key ? "active" : ""}`} onClick={() => setTab(key)}>
            <Icon size={16} />
            <span>{label}</span>
          </button>
        ))}
      </nav>

      {taskModal && (
        <TaskModal
          modal={taskModal}
          projects={scopedProjects}
          members={scopedMembers}
          isAdmin={isSuper || currentMember?.role === "admin"}
          onClose={() => setTaskModal(null)}
          onSave={saveTask}
        />
      )}

      {worklogModal && (
        <WorklogModal
          modal={worklogModal}
          tasks={scopedTasks}
          projects={scopedProjects}
          projectById={scopedProjectById}
          session={session}
          currentMember={currentMember}
          onClose={() => setWorklogModal(null)}
          onSave={saveWorklog}
          onDelete={(id) => {
            deleteWorklog(id);
            setWorklogModal(null);
          }}
        />
      )}

      {eventModal && (
        <EventModal
          modal={eventModal}
          session={session}
          currentMember={currentMember}
          members={scopedMembers}
          memberById={scopedMemberById}
          onClose={() => setEventModal(null)}
          onSave={saveEvent}
          onDelete={(id) => {
            deleteEvent(id);
            setEventModal(null);
          }}
        />
      )}

      {leaveModal && (
        <LeaveModal
          modal={leaveModal}
          session={session}
          currentMember={currentMember}
          onClose={() => setLeaveModal(null)}
          onSave={saveLeave}
          onDelete={(id) => {
            deleteLeave(id);
            setLeaveModal(null);
          }}
        />
      )}

      {projectDetailId && scopedProjectById[projectDetailId] && (
        <ProjectDetailModal
          project={scopedProjectById[projectDetailId]}
          tasks={scopedTasks.filter((t) => t.projectId === projectDetailId)}
          memberById={scopedMemberById}
          projectById={scopedProjectById}
          worklogTotalByTask={worklogTotalByTask}
          session={session}
          isAdmin={isSuper || currentMember?.role === "admin"}
          onClose={() => setProjectDetailId(null)}
          onNewTask={() =>
            setTaskModal({
              mode: "create",
              task: { id: uid(), title: "", projectId: projectDetailId, departmentId: scopedDepartmentId, assigneeId: session, status: "todo", priority: "medium" },
            })
          }
          onEditTask={(task) => setTaskModal({ mode: "edit", task })}
          onAskDeleteTask={(id) => setPendingDelete({ type: "task", id })}
          onSetStatus={setTaskStatus}
          onLogTime={(taskId) =>
            setWorklogModal({
              mode: "create",
              worklog: { id: uid(), taskId, memberId: session, departmentId: scopedDepartmentId, dateKey: toKey(new Date()), startMinutes: 540, endMinutes: 600, note: "" },
            })
          }
          pendingDelete={pendingDelete}
          onCancelDelete={() => setPendingDelete(null)}
        />
      )}

      {pendingDelete?.type === "task" && (
        <ConfirmBar
          label="이 업무를 삭제할까요? 기록된 시간도 함께 삭제돼요."
          onConfirm={() => deleteTask(pendingDelete.id)}
          onCancel={() => setPendingDelete(null)}
        />
      )}

      {pendingDelete?.type === "department" && (
        <ConfirmBar
          label={`"${departments.find((d) => d.id === pendingDelete.id)?.name || "이 본부"}"를 삭제할까요? 이 본부의 팀원, 프로젝트, 업무, 타임로그, 이벤트, 휴가 기록이 모두 함께 삭제돼요. 되돌릴 수 없어요.`}
          onConfirm={() => deleteDepartment(pendingDelete.id)}
          onCancel={() => setPendingDelete(null)}
        />
      )}
    </div>
  );
}

function ConfirmBar({ label, onConfirm, onCancel }) {
  return (
    <div className="ts-modal-backdrop" onClick={onCancel}>
      <div className="ts-modal ts-confirm-modal" onClick={(e) => e.stopPropagation()}>
        <p>{label}</p>
        <div className="ts-modal-actions">
          <button className="ts-btn ts-btn-ghost" onClick={onCancel}>
            취소
          </button>
          <button className="ts-btn ts-btn-danger-solid" onClick={onConfirm}>
            삭제
          </button>
        </div>
      </div>
    </div>
  );
}

      {initials(member?.name)}

function PriorityBadge({ priority }) {

    <span className="ts-priority-badge" style={{ color: PRIORITY_COLOR[priority] }}>
