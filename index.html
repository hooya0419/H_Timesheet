function AuthScreen({ departments, members, onLogin, onSignup, onBootstrapSuper }) {
  const isBootstrap = departments.length === 0 && members.length === 0;
  const [mode, setMode] = useState("login");
  const [deptId, setDeptId] = useState(SUPER_OPTION);
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  const [name, setName] = useState("");
  const [signupUsername, setSignupUsername] = useState("");
  const [signupPassword, setSignupPassword] = useState("");
  const [signupPassword2, setSignupPassword2] = useState("");
  const [color, setColor] = useState(PALETTE[0]);

  function submitLogin() {
    const uname = username.trim().toLowerCase();
    if (!uname || !password) {
      setError("계정과 비밀번호를 입력해주세요.");
      return;
    }
    const member =
      deptId === SUPER_OPTION
        ? members.find((m) => m.role === "super" && m.username.toLowerCase() === uname)
        : members.find((m) => m.username.toLowerCase() === uname && m.departmentId === deptId);
    if (!member || member.password !== password) {
      setError("계정 또는 비밀번호가 올바르지 않아요.");
      return;
    }
    setError("");
    onLogin(member.id);
  }

  function submitSignup() {
    const trimmedName = name.trim();
    const uname = signupUsername.trim();
    if (!trimmedName || !uname) {
      setError("이름과 계정을 입력해주세요.");
      return;
    }
    if (!deptId || deptId === SUPER_OPTION) {
      setError("본부를 선택해주세요.");
      return;
    }
    if (members.some((m) => m.username.toLowerCase() === uname.toLowerCase())) {
      setError("이미 사용 중인 계정이에요.");
      return;
    }
    if (signupPassword.length < 4) {
      setError("비밀번호는 4자 이상으로 설정해주세요.");
      return;
    }
    if (signupPassword !== signupPassword2) {
      setError("비밀번호가 서로 일치하지 않아요.");
      return;
    }
    setError("");
    onSignup({ name: trimmedName, username: uname, password: signupPassword, color, departmentId: deptId });
  }

  function submitBootstrap() {
    const trimmedName = name.trim();
    const uname = signupUsername.trim();
    if (!trimmedName || !uname) {
      setError("이름과 계정을 입력해주세요.");
      return;
    }
    if (signupPassword.length < 4) {
      setError("비밀번호는 4자 이상으로 설정해주세요.");
      return;
    }
    if (signupPassword !== signupPassword2) {
      setError("비밀번호가 서로 일치하지 않아요.");
      return;
    }
    setError("");
    onBootstrapSuper({ name: trimmedName, username: uname, password: signupPassword, color });
  }

  if (isBootstrap) {
    return (
      <div className="ts-auth-wrap">
        <div className="ts-auth-card">
          <div className="ts-brand ts-auth-brand">
            <img src={LOGO_SRC} alt="행림" className="ts-brand-logo" />
          </div>
          <p className="ts-auth-sub">아직 등록된 계정이 없어요. 시스템을 관리할 최고 관리자 계정을 먼저 만들어주세요.</p>
          <div className="ts-auth-body">
            <label className="ts-field-label">이름</label>
            <input className="ts-input" value={name} onChange={(e) => setName(e.target.value)} placeholder="이름을 입력하세요" autoFocus />

            <label className="ts-field-label">계정 (아이디)</label>
            <input className="ts-input" value={signupUsername} onChange={(e) => setSignupUsername(e.target.value)} placeholder="영문/숫자 아이디" />

            <label className="ts-field-label">색상</label>
            <div className="ts-swatches">
              {PALETTE.map((c) => (
                <button key={c} className={`ts-swatch ${color === c ? "selected" : ""}`} style={{ background: c }} onClick={() => setColor(c)} aria-label={`색상 ${c}`} />
              ))}
            </div>

            <div className="ts-modal-row">
              <div>
                <label className="ts-field-label">비밀번호</label>
                <input className="ts-input" type="password" value={signupPassword} onChange={(e) => setSignupPassword(e.target.value)} />
              </div>
              <div>
                <label className="ts-field-label">비밀번호 확인</label>
                <input className="ts-input" type="password" value={signupPassword2} onChange={(e) => setSignupPassword2(e.target.value)} />
              </div>
            </div>

            {error && <div className="ts-auth-error">{error}</div>}
            <button className="ts-btn ts-btn-start ts-auth-submit" onClick={submitBootstrap}>
              최고 관리자로 시작하기
            </button>
          </div>
          <p className="ts-auth-note">이 계정은 모든 본부를 만들고 관리할 수 있어요. 이후 여기서 본부별 계정을 만들 수 있어요.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="ts-auth-wrap">
      <div className="ts-auth-card">
        <div className="ts-brand ts-auth-brand">
          <img src={LOGO_SRC} alt="행림" className="ts-brand-logo" />
        </div>
        <p className="ts-auth-sub">본부를 선택하고 계정으로 로그인해주세요.</p>

        <div className="ts-auth-tabs">
          <button className={`ts-auth-tab ${mode === "login" ? "active" : ""}`} onClick={() => { setMode("login"); setError(""); }}>
            로그인
          </button>
          <button className={`ts-auth-tab ${mode === "signup" ? "active" : ""}`} onClick={() => { setMode("signup"); setError(""); if (deptId === SUPER_OPTION) setDeptId(departments[0]?.id || ""); }}>
            회원가입
          </button>
        </div>

        <div className="ts-auth-body">
          <label className="ts-field-label">작업공간 (본부)</label>
          <select className="ts-select ts-select-full" value={deptId} onChange={(e) => setDeptId(e.target.value)}>
            {mode === "login" && <option value={SUPER_OPTION}>최고 관리자 (전체)</option>}
            {departments.length === 0 && <option value="">등록된 본부 없음</option>}
            {departments.map((d) => (
              <option key={d.id} value={d.id}>
                {d.name}
              </option>
            ))}
          </select>

          {mode === "login" ? (
            <>
              <label className="ts-field-label">계정</label>
              <input className="ts-input" value={username} onChange={(e) => setUsername(e.target.value)} placeholder="아이디" />
              <label className="ts-field-label">비밀번호</label>
              <input
                className="ts-input"
                type="password"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && submitLogin()}
              />
              {error && <div className="ts-auth-error">{error}</div>}
              <button className="ts-btn ts-btn-start ts-auth-submit" onClick={submitLogin}>
                로그인
              </button>
            </>
          ) : (
            <>
              <label className="ts-field-label">이름</label>
              <input className="ts-input" value={name} onChange={(e) => setName(e.target.value)} placeholder="이름을 입력하세요" />

              <label className="ts-field-label">계정 (아이디)</label>
              <input className="ts-input" value={signupUsername} onChange={(e) => setSignupUsername(e.target.value)} placeholder="영문/숫자 아이디" />

              <label className="ts-field-label">색상</label>
              <div className="ts-swatches">
                {PALETTE.map((c) => (
                  <button key={c} className={`ts-swatch ${color === c ? "selected" : ""}`} style={{ background: c }} onClick={() => setColor(c)} aria-label={`색상 ${c}`} />
                ))}
              </div>

              <div className="ts-modal-row">
                <div>
                  <label className="ts-field-label">비밀번호</label>
                  <input className="ts-input" type="password" value={signupPassword} onChange={(e) => setSignupPassword(e.target.value)} />
                </div>
                <div>
                  <label className="ts-field-label">비밀번호 확인</label>
                  <input className="ts-input" type="password" value={signupPassword2} onChange={(e) => setSignupPassword2(e.target.value)} />
                </div>
              </div>

              {error && <div className="ts-auth-error">{error}</div>}
              <button className="ts-btn ts-btn-start ts-auth-submit" onClick={submitSignup} disabled={!departments.length}>
                가입하고 시작하기
              </button>
            </>
          )}
        </div>
        <p className="ts-auth-note">간단한 팀 내부용 로그인이에요. 비밀번호는 암호화되지 않으니 민감한 계정 정보로는 사용하지 마세요.</p>
      </div>
    </div>
  );
}

function ProjectProgressSection({ projects, tasks, onOpenDetail }) {
  if (projects.length === 0) return null;
  return (
    <div>
      <div className="ts-section-head">
        <h2>프로젝트 진행 현황</h2>
      </div>
      <div className="ts-card ts-list-card">
        {projects.map((p) => {
          const projTasks = tasks.filter((t) => t.projectId === p.id);
          const total = projTasks.length;
          const done = projTasks.filter((t) => t.status === "done").length;
          const pct = total === 0 ? 0 : Math.round((done / total) * 100);
          return (
            <div className="ts-progress-row" key={p.id} onClick={() => onOpenDetail?.(p.id)} role="button" tabIndex={0}>
              <span className="ts-dot" style={{ background: p.color }} />
              <div className="ts-project-info">
                <div className="ts-project-name">{p.name}</div>
                <div className="ts-muted">{total === 0 ? "등록된 업무 없음" : `업무 ${done}/${total}개 완료`}</div>
              </div>
              <div className="ts-progress-pct-wrap">
                <div className="ts-progress-track">
                  <div className="ts-progress-fill" style={{ width: `${pct}%`, background: p.color }} />
                </div>
                <span className="ts-progress-pct-num">{pct}%</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function BoardTab({
  tasks,
  members,
  memberById,
  projects,
  projectById,
  worklogTotalByTask,
  session,
  isAdmin,
  onNewTask,
  onEditTask,
  onAskDeleteTask,
  onSetStatus,
  onLogTime,
  pendingDelete,
  onCancelDelete,
  onSync,
  syncing,
  onOpenDetail,
}) {
  const [filterMemberId, setFilterMemberId] = useState(null);
  const [selectedProjectId, setSelectedProjectId] = useState(null);

  const filteredTasks = filterMemberId ? tasks.filter((t) => t.assigneeId === filterMemberId) : tasks;

  function selectProject(id) {
    setSelectedProjectId((prev) => (prev === id ? null : id));
  }

  const selectedProject = selectedProjectId ? projectById[selectedProjectId] : null;
  const selectedProjectTasks = selectedProjectId ? filteredTasks.filter((t) => t.projectId === selectedProjectId) : [];
  const selectedCounts = {};
  STATUS_ORDER.forEach((s) => (selectedCounts[s] = 0));
  selectedProjectTasks.forEach((t) => (selectedCounts[t.status] = (selectedCounts[t.status] || 0) + 1));
  const selectedRemaining = selectedProjectTasks.length - selectedCounts.done;

  return (
    <div className="ts-stack">
      <div className="ts-section-head">
        <h2>업무 보드</h2>
        <div className="ts-board-head-actions">
          <button className="ts-add-mini" onClick={onSync} aria-label="새로고침">
            <RefreshCw size={13} className={syncing ? "spin" : ""} />
          </button>
          <button className="ts-btn ts-btn-start ts-btn-small" onClick={onNewTask}>
            <Plus size={14} />새 업무
          </button>
        </div>
      </div>

      <ProjectProgressSection projects={projects} tasks={tasks} onOpenDetail={onOpenDetail} />

      {members.length > 0 && (
        <div className="ts-filter-row">
          <button className={`ts-filter-chip ${filterMemberId === null ? "selected" : ""}`} onClick={() => setFilterMemberId(null)}>
            전체
          </button>
          {members.map((m) => (
            <button
              key={m.id}
              className={`ts-filter-chip ${filterMemberId === m.id ? "selected" : ""}`}
              style={filterMemberId === m.id ? { background: m.color + "22", color: m.color, borderColor: m.color + "55" } : {}}
              onClick={() => setFilterMemberId(m.id)}
            >
              {m.name}
            </button>
          ))}
        </div>
      )}

      <div className="ts-section-head">
        <h2>프로젝트별 세부업무</h2>
      </div>

      {projects.length === 0 ? (
        <div className="ts-card ts-list-card">
          <EmptyState label="등록된 프로젝트가 없어요." />
        </div>
      ) : (
        <>
          <div className="ts-filter-row">
            {projects.map((project) => (
              <button
                key={project.id}
                className={`ts-filter-chip ts-project-toggle-chip ${selectedProjectId === project.id ? "selected" : ""}`}
                style={selectedProjectId === project.id ? { background: project.color + "22", color: project.color, borderColor: project.color + "55" } : {}}
                onClick={() => selectProject(project.id)}
              >
                <span className="ts-dot" style={{ background: project.color }} />
                {project.name}
              </button>
            ))}
          </div>

          {!selectedProject ? (
            <div className="ts-card ts-list-card">
              <EmptyState label="프로젝트를 선택하면 세부 업무가 보여요." />
            </div>
          ) : (
            <>
              {selectedProjectTasks.length > 0 && (
                <div className="ts-project-status-summary">
                  <span className="ts-col-count">잔여 {selectedRemaining}건</span>
                  {STATUS_ORDER.map((s) => (
                    <span key={s} className="ts-status-count-chip">
                      {STATUS_LABEL[s]} <b>{selectedCounts[s]}</b>
                    </span>
                  ))}
                </div>
              )}
              {selectedProjectTasks.length === 0 ? (
                <div className="ts-card ts-list-card">
                  <EmptyState label="이 프로젝트에 등록된 업무가 없어요." small />
                </div>
              ) : (
                <StatusColumns
                  tasks={selectedProjectTasks}
                  memberById={memberById}
                  projectById={projectById}
                  worklogTotalByTask={worklogTotalByTask}
                  session={session}
                  isAdmin={isAdmin}
                  onEditTask={onEditTask}
                  onAskDeleteTask={onAskDeleteTask}
                  onSetStatus={onSetStatus}
                  onLogTime={onLogTime}
                  pendingDelete={pendingDelete}
                  onCancelDelete={onCancelDelete}
                />
              )}
            </>
          )}
        </>
      )}
    </div>
  );
}

function StatusColumns({
  tasks,
  memberById,
  projectById,
  worklogTotalByTask,
  session,
  isAdmin,
  onEditTask,
  onAskDeleteTask,
  onSetStatus,
  onLogTime,
  pendingDelete,
}) {
  return (
    <>
      {STATUS_ORDER.map((status) => {
        const columnTasks = tasks.filter((t) => t.status === status);
        return (
          <div key={status} className="ts-status-col">
            <div className="ts-section-head">
              <h2>
                {STATUS_LABEL[status]} <span className="ts-col-count">{columnTasks.length}</span>
              </h2>
            </div>
            {columnTasks.length === 0 ? (
              <div className="ts-card ts-list-card">
                <EmptyState label="이 상태의 업무가 없어요." small />
              </div>
            ) : (
              <div className="ts-stack ts-tight">
                {columnTasks.map((task) => (
                  <TaskCard
                    key={task.id}
                    task={task}
                    project={projectById[task.projectId]}
                    assignee={memberById[task.assigneeId]}
                    totalMinutes={worklogTotalByTask[task.id] || 0}
                    canManage={isAdmin || task.assigneeId === session}
                    confirming={pendingDelete?.type === "task" && pendingDelete.id === task.id}
                    onEdit={() => onEditTask(task)}
                    onAskDelete={() => onAskDeleteTask(task.id)}
                    onSetStatus={(status) => onSetStatus(task.id, status)}
                    onLogTime={() => onLogTime(task.id)}
                  />
                ))}
              </div>
            )}
          </div>
        );
      })}
    </>
  );
}

function TaskCard({ task, project, assignee, totalMinutes, canManage, confirming, onEdit, onAskDelete, onSetStatus, onLogTime }) {
  return (
    <div className="ts-card ts-task-card">
      <div className="ts-task-top">
        <div className="ts-task-title-wrap">
          <div className="ts-task-title">{task.title || "제목 없음"}</div>
          <div className="ts-task-meta">
            <span className="ts-dot ts-dot-inline" style={{ background: project?.color || "#C9C4BA" }} />
            {project?.name || "삭제된 프로젝트"}
            <span className="ts-task-meta-sep">·</span>
            <MemberAvatar member={assignee} size={16} />
            {assignee?.name || "미배정"}
          </div>
        </div>
        <PriorityBadge priority={task.priority} />
      </div>

      <div className="ts-segmented ts-status-toggle">
        {STATUS_ORDER.map((s) => (
          <button
            key={s}
            type="button"
            className={`ts-segmented-btn ${task.status === s ? "selected" : ""}`}
            onClick={() => onSetStatus(s)}
          >
            {STATUS_LABEL[s]}
          </button>
        ))}
      </div>

      <div className="ts-task-bottom">
        <button className="ts-time-chip" onClick={onLogTime}>
          <Clock3 size={12} />
          {fmtHM(totalMinutes)}
        </button>
        {canManage ? (
          <div className="ts-task-actions">
            <button className="ts-icon-btn" onClick={onEdit} aria-label="업무 수정">
              <Pencil size={13} />
            </button>
            {confirming ? null : (
              <button className="ts-icon-btn" onClick={onAskDelete} aria-label="업무 삭제">
                <Trash2 size={13} />
              </button>
            )}
          </div>
        ) : (
          <div className="ts-task-actions-spacer" />
        )}
      </div>
    </div>
  );
}

const HOUR_HEIGHT = 48; // px per hour
const WEEKDAY_LABELS = ["일", "월", "화", "수", "목", "금", "토"];

function layoutDayLogs(logs) {
  const sorted = [...logs].sort((a, b) => a.startMinutes - b.startMinutes || a.endMinutes - b.endMinutes);
  const columnEnds = [];
  const placed = sorted.map((log) => {
    let col = columnEnds.findIndex((end) => end <= log.startMinutes);
    if (col === -1) {
      col = columnEnds.length;
      columnEnds.push(log.endMinutes);
    } else {
      columnEnds[col] = log.endMinutes;
    }
    return { ...log, col };
  });
  const totalCols = columnEnds.length || 1;
  return placed.map((p) => ({ ...p, totalCols }));
}

function fmtFullDate(d) {
  return d.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "long" });
}
function fmtMonthLabel(d) {
  return d.toLocaleDateString("ko-KR", { year: "numeric", month: "long" });
}
function participantsLabel(item, memberById) {
  if (!item.participantIds || item.participantIds.length === 0) return "";
  const names = item.participantIds.map((id) => memberById[id]?.name).filter(Boolean);
  return names.length ? ` · 참여: ${names.join(", ")}` : "";
}
function addMonths(d, n) {
  const r = new Date(d);
  r.setDate(1); // 말일 넘어가는 것 방지
  r.setMonth(r.getMonth() + n);
  return r;
}

function TimesheetTab({
  selectedDate,
  setSelectedDate,
  worklogs,
  events,
  tasks,
  members,
  memberById,
  projectById,
  session,
  onEdit,
  onCreate,
  onEditEvent,
  onCreateEvent,
}) {
  const [filterMemberId, setFilterMemberId] = useState(null);
  const [view, setView] = useState("day"); // day | week | month
  const [colorBy, setColorBy] = useState("project"); // project | member
  const scrollRef = useRef(null);

  const taskById = useMemo(() => {
    const map = {};
    tasks.forEach((t) => (map[t.id] = t));
    return map;
  }, [tasks]);

  const dateKey = toKey(selectedDate);
  const isToday = isSameDay(selectedDate, new Date());

  const filteredLogs = useMemo(
    () => worklogs.filter((w) => (filterMemberId ? w.memberId === filterMemberId : true) && w.startMinutes !== undefined),
    [worklogs, filterMemberId]
  );
  const filteredEvents = useMemo(
    () => events.filter((e) => (filterMemberId ? e.memberId === filterMemberId : true)),
    [events, filterMemberId]
  );

  const dayLogs = useMemo(() => filteredLogs.filter((w) => w.dateKey === dateKey), [filteredLogs, dateKey]);
  const dayEventsAll = useMemo(() => filteredEvents.filter((e) => eventOccursOn(e, dateKey)), [filteredEvents, dateKey]);
  const dayAllDayEvents = useMemo(() => dayEventsAll.filter((e) => e.allDay), [dayEventsAll]);
  const dayTimedEvents = useMemo(() => dayEventsAll.filter((e) => !e.allDay), [dayEventsAll]);
  const dayTotal = dayLogs.reduce((s, w) => s + w.minutes, 0);
  const laidOut = useMemo(
    () => layoutDayLogs([...dayLogs.map((w) => ({ ...w, kind: "work" })), ...dayTimedEvents.map((e) => ({ ...e, kind: "event" }))]),
    [dayLogs, dayTimedEvents]
  );

  useLayoutEffect(() => {
    if ((view === "day" || view === "week") && scrollRef.current) scrollRef.current.scrollTop = Math.max(0, 7 * HOUR_HEIGHT - 40);
  }, [dateKey, view]);

  // 주간 그리드 (일요일 시작)
  const weekStart = useMemo(() => addDays(selectedDate, -selectedDate.getDay()), [selectedDate]);
  const weekDays = useMemo(() => Array.from({ length: 7 }, (_, i) => addDays(weekStart, i)), [weekStart]);
  const weekDayData = useMemo(
    () =>
      weekDays.map((d) => {
        const key = toKey(d);
        const logs = filteredLogs.filter((w) => w.dateKey === key);
        const evsAll = filteredEvents.filter((e) => eventOccursOn(e, key));
        const allDayEvs = evsAll.filter((e) => e.allDay);
        const timedEvs = evsAll.filter((e) => !e.allDay);
        return {
          date: d,
          key,
          total: logs.reduce((s, w) => s + w.minutes, 0),
          allDayEvents: allDayEvs,
          laidOut: layoutDayLogs([...logs.map((w) => ({ ...w, kind: "work" })), ...timedEvs.map((e) => ({ ...e, kind: "event" }))]),
        };
      }),
    [weekDays, filteredLogs, filteredEvents]
  );
  const weekTotal = weekDayData.reduce((s, d) => s + d.total, 0);

  // 월간 그리드 (일요일 시작, 6주 고정)
  const monthGridStart = useMemo(() => {
    const first = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
    return addDays(first, -first.getDay());
  }, [selectedDate]);
  const monthDays = useMemo(() => Array.from({ length: 42 }, (_, i) => addDays(monthGridStart, i)), [monthGridStart]);
  const monthLogsByDay = useMemo(() => {
    const map = {};
    monthDays.forEach((d) => {
      const key = toKey(d);
      const logs = filteredLogs.filter((w) => w.dateKey === key);
      const evs = filteredEvents.filter((e) => eventOccursOn(e, key));
      const total = logs.reduce((s, w) => s + w.minutes, 0);
      const projectIds = [...new Set(logs.map((w) => taskById[w.taskId]?.projectId).filter(Boolean))];
      const memberIds = [...new Set(logs.map((w) => w.memberId).filter(Boolean))];
      map[key] = { total, projectIds, memberIds, events: evs };
    });
    return map;
  }, [monthDays, filteredLogs, filteredEvents, taskById]);
  const monthTotal = useMemo(
    () => monthDays.filter((d) => d.getMonth() === selectedDate.getMonth()).reduce((s, d) => s + (monthLogsByDay[toKey(d)]?.total || 0), 0),
    [monthDays, monthLogsByDay, selectedDate]
  );

  function goPrev() {
    if (view === "day") setSelectedDate(addDays(selectedDate, -1));
    else if (view === "week") setSelectedDate(addDays(selectedDate, -7));
    else setSelectedDate(addMonths(selectedDate, -1));
  }
  function goNext() {
    if (view === "day") setSelectedDate(addDays(selectedDate, 1));
    else if (view === "week") setSelectedDate(addDays(selectedDate, 7));
    else setSelectedDate(addMonths(selectedDate, 1));
  }
  const weekEnd = addDays(weekStart, 6);
  const weekLabel = `${monthDay(weekStart)} – ${monthDay(weekEnd)}`;

  return (
    <div className="ts-stack">
      <div className="ts-card">
        <div className="ts-week-nav">
          <button className="ts-icon-btn" onClick={goPrev} aria-label={view === "day" ? "이전 날" : view === "week" ? "이전 주" : "이전 달"}>
            <ChevronLeft size={16} />
          </button>
          <div className="ts-week-label">
            {view === "day" ? fmtFullDate(selectedDate) : view === "week" ? weekLabel : fmtMonthLabel(selectedDate)}
            {view === "day" && isToday && <span className="ts-today-tag">오늘</span>}
          </div>
          <button className="ts-icon-btn" onClick={goNext} aria-label={view === "day" ? "다음 날" : view === "week" ? "다음 주" : "다음 달"}>
            <ChevronRight size={16} />
          </button>
          <button className="ts-today-btn" onClick={() => setSelectedDate(new Date())}>
            오늘
          </button>
          {view === "month" ? (
            <input
              type="month"
              className="ts-jump-input"
              value={`${selectedDate.getFullYear()}-${pad(selectedDate.getMonth() + 1)}`}
              onChange={(e) => {
                if (!e.target.value) return;
                const [y, m] = e.target.value.split("-").map(Number);
                setSelectedDate(new Date(y, m - 1, 1));
              }}
              aria-label="원하는 달로 이동"
            />
          ) : (
            <input
              type="date"
              className="ts-jump-input"
              value={dateKey}
              onChange={(e) => {
                if (!e.target.value) return;
                const [y, m, d] = e.target.value.split("-").map(Number);
                setSelectedDate(new Date(y, m - 1, d));
              }}
              aria-label="원하는 날짜로 이동"
            />
          )}
        </div>

        <div className="ts-view-toggle-row">
          <div className="ts-view-toggle">
            <button className={view === "day" ? "selected" : ""} onClick={() => setView("day")}>
              일
            </button>
            <button className={view === "week" ? "selected" : ""} onClick={() => setView("week")}>
              주
            </button>
            <button className={view === "month" ? "selected" : ""} onClick={() => setView("month")}>
              월
            </button>
          </div>
          <div className="ts-view-toggle ts-color-toggle">
            <button className={colorBy === "project" ? "selected" : ""} onClick={() => setColorBy("project")}>
              프로젝트별 색상
            </button>
            <button className={colorBy === "member" ? "selected" : ""} onClick={() => setColorBy("member")}>
              팀원별 색상
            </button>
          </div>
        </div>

        {colorBy === "member" && members.length > 0 && (
          <div className="ts-color-legend">
            {members.map((m) => (
              <span key={m.id} className="ts-color-legend-item">
                <span className="ts-dot" style={{ background: m.color }} />
                {m.name}
              </span>
            ))}
          </div>
        )}

        {colorBy === "project" && Object.keys(projectById).length > 0 && (
          <div className="ts-color-legend">
            {Object.values(projectById).map((p) => (
              <span key={p.id} className="ts-color-legend-item">
                <span className="ts-dot" style={{ background: p.color }} />
                {p.name}
              </span>
            ))}
          </div>
        )}

        {members.length > 0 && (
          <div className="ts-filter-row">
            <button className={`ts-filter-chip ${filterMemberId === null ? "selected" : ""}`} onClick={() => setFilterMemberId(null)}>
              전체
            </button>
            {members.map((m) => (
              <button
                key={m.id}
                className={`ts-filter-chip ${filterMemberId === m.id ? "selected" : ""}`}
                style={filterMemberId === m.id ? { background: m.color + "22", color: m.color, borderColor: m.color + "55" } : {}}
                onClick={() => setFilterMemberId(m.id)}
              >
                {m.name}
              </button>
            ))}
          </div>
        )}

        <div className="ts-cal-summary">
          <span className="ts-muted">
            {view === "day" && `이 날 총 ${fmtHM(dayTotal)} 기록됨`}
            {view === "week" && `이번 주 총 ${fmtHM(weekTotal)} 기록됨`}
            {view === "month" && `이번 달 총 ${fmtHM(monthTotal)} 기록됨`}
          </span>
          {view === "day" && (
            <div className="ts-cal-summary-actions">
              <button className="ts-btn ts-btn-ghost ts-btn-small ts-btn-outline" onClick={() => onCreateEvent(dateKey)}>
                <Plus size={14} />
                이벤트
              </button>
              <button className="ts-btn ts-btn-start ts-btn-small" onClick={() => onCreate(dateKey)}>
                <Plus size={14} />
                기록 추가
              </button>
            </div>
          )}
        </div>
      </div>


      {view === "day" && dayAllDayEvents.length > 0 && (
        <div className="ts-allday-block">
          <div className="ts-allday-block-label">
            <CalendarDays size={13} />
            종일 일정 (일단위)
          </div>
          <div className="ts-allday-strip">
            {dayAllDayEvents.map((e) => {
              const cat = EVENT_CATEGORY_BY_ID[e.categoryId] || EVENT_CATEGORIES[EVENT_CATEGORIES.length - 1];
              const member = memberById[e.memberId];
              const own = e.memberId === session;
              const chipColor = colorBy === "member" ? member?.color || "#C9C4BA" : cat.color;
              return (
                <button
                  key={e.id}
                  className="ts-allday-chip"
                  style={{ background: chipColor + "1a", color: chipColor, borderColor: chipColor }}
                  onClick={own ? () => onEditEvent(e) : undefined}
                  disabled={!own}
                  title={`[${cat.label}] ${e.title || "제목 없음"} · ${member?.name || ""}${participantsLabel(e, memberById)}`}
                >
                  <span className="ts-allday-chip-cat">{cat.label}</span>
                  {e.title || "제목 없음"}
                  {filterMemberId === null && ` · ${member?.name || ""}`}
                  {e.participantIds?.length > 0 && ` +${e.participantIds.length}`}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {view === "day" && (
        <div className="ts-cal-scroll" ref={scrollRef}>
          <div className="ts-cal-body" style={{ height: 24 * HOUR_HEIGHT }}>
            <div className="ts-cal-labels">
              {Array.from({ length: 24 }, (_, h) => (
                <div key={h} className="ts-cal-label" style={{ top: h * HOUR_HEIGHT }}>
                  {pad(h)}:00
                </div>
              ))}
            </div>
            <div className="ts-cal-lines">
              {Array.from({ length: 24 }, (_, h) => (
                <div key={h} className="ts-cal-line" style={{ top: h * HOUR_HEIGHT }} />
              ))}
              {laidOut.length === 0 && (
                <div className="ts-cal-empty">
                  <EmptyState label="이 날 기록된 시간이 없어요." />
                </div>
              )}
              {laidOut.map((log) => {
                const top = (log.startMinutes / 60) * HOUR_HEIGHT;
                const height = Math.max(18, ((log.endMinutes - log.startMinutes) / 60) * HOUR_HEIGHT);
                const widthPct = 100 / log.totalCols;
                const own = log.memberId === session;
                const member = memberById[log.memberId];
                const positionStyle = {
                  top,
                  height,
                  left: `calc(${log.col * widthPct}% + 2px)`,
                  width: `calc(${widthPct}% - 4px)`,
                };

                if (log.kind === "event") {
                  const cat = EVENT_CATEGORY_BY_ID[log.categoryId] || EVENT_CATEGORIES[EVENT_CATEGORIES.length - 1];
                  const evColor = colorBy === "member" ? member?.color || "#C9C4BA" : cat.color;
                  return (
                    <button
                      key={log.id}
                      className={`ts-cal-event ts-cal-event-type-event ${own ? "own" : ""}`}
                      style={{ ...positionStyle, background: evColor + "1a", borderLeftColor: evColor }}
                      onClick={own ? () => onEditEvent(log) : undefined}
                      disabled={!own}
                      title={`[${cat.label}] ${log.title || "제목 없음"} · ${member?.name || ""} · ${fmtTime(log.startMinutes)}–${fmtTime(log.endMinutes)}${participantsLabel(log, memberById)}`}
                    >
                      <span className="ts-cal-event-title">
                        <span className="ts-cal-event-cat" style={{ color: evColor }}>
                          {cat.label}
                        </span>{" "}
                        {log.title || "제목 없음"}
                      </span>
                      <span className="ts-cal-event-time">
                        {fmtTime(log.startMinutes)}–{fmtTime(log.endMinutes)}
                        {filterMemberId === null && ` · ${member?.name || ""}`}
                        {log.participantIds?.length > 0 && ` · +${log.participantIds.length}명`}
                      </span>
                    </button>
                  );
                }

                const task = taskById[log.taskId];
                const project = projectById[task?.projectId];
                const color = colorBy === "member" ? member?.color || "#C9C4BA" : project?.color || "#C9C4BA";
                return (
                  <button
                    key={log.id}
                    className={`ts-cal-event ${own ? "own" : ""}`}
                    style={{ ...positionStyle, background: color + "26", borderLeftColor: color }}
                    onClick={own ? () => onEdit(log) : undefined}
                    disabled={!own}
                    title={`${task?.title || "삭제된 업무"} · ${member?.name || ""} · ${fmtTime(log.startMinutes)}–${fmtTime(log.endMinutes)}`}
                  >
                    <span className="ts-cal-event-title">{task?.title || "삭제된 업무"}</span>
                    <span className="ts-cal-event-time">
                      {fmtTime(log.startMinutes)}–{fmtTime(log.endMinutes)}
                      {filterMemberId === null && ` · ${member?.name || ""}`}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {view === "week" && (
        <div className="ts-week-outer">
          <div className="ts-week-inner">
            <div className="ts-week-header-row">
              <div className="ts-week-header-spacer" />
              {weekDayData.map(({ date }) => {
                const isDayToday = isSameDay(date, new Date());
                return (
                  <div key={toKey(date)} className={`ts-week-header-day ${isDayToday ? "today" : ""}`}>
                    <span className="ts-week-header-dow">{weekdayShort(date)}</span>
                    <span className="ts-week-header-num">{date.getDate()}</span>
                  </div>
                );
              })}
            </div>
            {weekDayData.some((d) => d.allDayEvents.length > 0) && (
              <div className="ts-allday-block">
                <div className="ts-allday-block-label">
                  <CalendarDays size={13} />
                  종일 일정 (일단위)
                </div>
                <div className="ts-week-allday-row">
                  <div className="ts-week-header-spacer" />
                  {weekDayData.map(({ key, allDayEvents }) => (
                    <div key={key} className="ts-week-allday-col">
                      {allDayEvents.map((e) => {
                        const cat = EVENT_CATEGORY_BY_ID[e.categoryId] || EVENT_CATEGORIES[EVENT_CATEGORIES.length - 1];
                        const own = e.memberId === session;
                        const chipColor = colorBy === "member" ? memberById[e.memberId]?.color || "#C9C4BA" : cat.color;
                        return (
                          <button
                            key={e.id}
                            className="ts-allday-chip ts-allday-chip-small"
                            style={{ background: chipColor + "1a", color: chipColor, borderColor: chipColor }}
                            onClick={own ? () => onEditEvent(e) : undefined}
                            disabled={!own}
                            title={`[${cat.label}] ${e.title || "제목 없음"}${participantsLabel(e, memberById)}`}
                          >
                            {e.title || cat.label}
                          </button>
                        );
                      })}
                    </div>
                  ))}
                </div>
              </div>
            )}
            <div className="ts-cal-scroll" ref={scrollRef}>
              <div className="ts-cal-body" style={{ height: 24 * HOUR_HEIGHT }}>
                <div className="ts-cal-labels">
                  {Array.from({ length: 24 }, (_, h) => (
                    <div key={h} className="ts-cal-label" style={{ top: h * HOUR_HEIGHT }}>
                      {pad(h)}:00
                    </div>
                  ))}
                </div>
                <div className="ts-week-days-grid">
                  {weekDayData.map(({ key, laidOut: colLogs }) => (
                    <div key={key} className="ts-week-daycol">
                      {Array.from({ length: 24 }, (_, h) => (
                        <div key={h} className="ts-cal-line" style={{ top: h * HOUR_HEIGHT }} />
                      ))}
                      {colLogs.map((log) => {
                        const top = (log.startMinutes / 60) * HOUR_HEIGHT;
                        const height = Math.max(16, ((log.endMinutes - log.startMinutes) / 60) * HOUR_HEIGHT);
                        const widthPct = 100 / log.totalCols;
                        const own = log.memberId === session;
                        const positionStyle = {
                          top,
                          height,
                          left: `calc(${log.col * widthPct}% + 1px)`,
                          width: `calc(${widthPct}% - 2px)`,
                        };

                        if (log.kind === "event") {
                          const cat = EVENT_CATEGORY_BY_ID[log.categoryId] || EVENT_CATEGORIES[EVENT_CATEGORIES.length - 1];
                          const evColor = colorBy === "member" ? memberById[log.memberId]?.color || "#C9C4BA" : cat.color;
                          return (
                            <button
                              key={log.id}
                              className={`ts-cal-event ts-week-event ts-cal-event-type-event ${own ? "own" : ""}`}
                              style={{ ...positionStyle, background: evColor + "1a", borderLeftColor: evColor }}
                              onClick={own ? () => onEditEvent(log) : undefined}
                              disabled={!own}
                              title={`[${cat.label}] ${log.title || "제목 없음"} · ${fmtTime(log.startMinutes)}–${fmtTime(log.endMinutes)}${participantsLabel(log, memberById)}`}
                            >
                              <span className="ts-cal-event-title">{log.title || cat.label}</span>
                            </button>
                          );
                        }

                        const task = taskById[log.taskId];
                        const project = projectById[task?.projectId];
                        const color = colorBy === "member" ? memberById[log.memberId]?.color || "#C9C4BA" : project?.color || "#C9C4BA";
                        return (
                          <button
                            key={log.id}
                            className={`ts-cal-event ts-week-event ${own ? "own" : ""}`}
                            style={{ ...positionStyle, background: color + "26", borderLeftColor: color }}
                            onClick={own ? () => onEdit(log) : undefined}
                            disabled={!own}
                            title={`${task?.title || "삭제된 업무"} · ${fmtTime(log.startMinutes)}–${fmtTime(log.endMinutes)}`}
                          >
                            <span className="ts-cal-event-title">{task?.title || "삭제된 업무"}</span>
                          </button>
                        );
                      })}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {view === "month" && (
        <div className="ts-month-wrap">
          <div className="ts-month-weekdays">
            {WEEKDAY_LABELS.map((w) => (
              <div key={w} className="ts-month-weekday">
                {w}
              </div>
            ))}
          </div>
          <div className="ts-month-days">
            {monthDays.map((d) => {
              const key = toKey(d);
              const inMonth = d.getMonth() === selectedDate.getMonth();
              const isDayToday = isSameDay(d, new Date());
              const info = monthLogsByDay[key] || { total: 0, projectIds: [], memberIds: [], events: [] };
              return (
                <button
                  key={key}
                  className={`ts-month-cell ${inMonth ? "" : "muted"}`}
                  onClick={() => {
                    setSelectedDate(d);
                    setView("day");
                  }}
                >
                  <span className={`ts-month-daynum ${isDayToday ? "today" : ""}`}>{d.getDate()}</span>
                  {info.total > 0 && <span className="ts-month-daytotal">{fmtHM(info.total)}</span>}
                  {colorBy === "member"
                    ? info.memberIds.length > 0 && (
                        <span className="ts-month-dots">
                          {info.memberIds.slice(0, 4).map((mid) => (
                            <span key={mid} className="ts-dot" style={{ background: memberById[mid]?.color || "#C9C4BA" }} />
                          ))}
                        </span>
                      )
                    : info.projectIds.length > 0 && (
                        <span className="ts-month-dots">
                          {info.projectIds.slice(0, 4).map((pid) => (
                            <span key={pid} className="ts-dot" style={{ background: projectById[pid]?.color || "#C9C4BA" }} />
                          ))}
                        </span>
                      )}
                  {info.events.length > 0 && (
                    <span className="ts-month-events">
                      {info.events.slice(0, 2).map((e) => {
                        const cat = EVENT_CATEGORY_BY_ID[e.categoryId] || EVENT_CATEGORIES[EVENT_CATEGORIES.length - 1];
                        const chipColor = colorBy === "member" ? memberById[e.memberId]?.color || "#C9C4BA" : cat.color;
                        return (
                          <span key={e.id} className="ts-month-event-chip" style={{ background: chipColor + "22", color: chipColor }}>
                            {e.title || cat.label}
                          </span>
                        );
                      })}
                      {info.events.length > 2 && <span className="ts-month-event-more">+{info.events.length - 2}</span>}
                    </span>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function ProfileTab({ currentMember, departmentName, onSave, onChangePassword }) {
  const [name, setName] = useState(currentMember?.name || "");
  const [position, setPosition] = useState(currentMember?.position || "");
  const [error, setError] = useState("");
  const [savedFlash, setSavedFlash] = useState(false);

  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [newPassword2, setNewPassword2] = useState("");
  const [pwError, setPwError] = useState("");
  const [pwSavedFlash, setPwSavedFlash] = useState(false);

  useEffect(() => {
    setName(currentMember?.name || "");
    setPosition(currentMember?.position || "");
  }, [currentMember?.id]); // eslint-disable-line

  function handleSave() {
    const result = onSave({ name, position });
    if (!result?.ok) {
      setError(result?.error || "저장하지 못했어요.");
      return;
    }
    setError("");
    setSavedFlash(true);
    setTimeout(() => setSavedFlash(false), 1800);
  }

  function handleChangePassword() {
    const result = onChangePassword({ currentPassword, newPassword, newPassword2 });
    if (!result?.ok) {
      setPwError(result?.error || "변경하지 못했어요.");
      return;
    }
    setPwError("");
    setCurrentPassword("");
    setNewPassword("");
    setNewPassword2("");
    setPwSavedFlash(true);
    setTimeout(() => setPwSavedFlash(false), 1800);
  }

  const dirty = name.trim() !== (currentMember?.name || "") || position.trim() !== (currentMember?.position || "");
  const pwValid = currentPassword.length > 0 && newPassword.length >= 4 && newPassword === newPassword2;

  return (
    <div className="ts-stack">
      <div className="ts-section-head">
        <h2>내 정보</h2>
      </div>

      <div className="ts-card ts-profile-card">
        <div className="ts-profile-head">
          <MemberAvatar member={{ ...currentMember, name }} size={48} />
          <div>
            <div className="ts-profile-name-preview">{name || "이름 없음"}</div>
            <div className="ts-muted">
              {departmentName || "본부 미지정"} · {position || "직급 미지정"}
              {currentMember?.role !== "member" && <span className="ts-admin-badge">{ROLE_LABEL[currentMember?.role]}</span>}
            </div>
            <div className="ts-muted">계정: @{currentMember?.username}</div>
          </div>
        </div>

        <label className="ts-field-label">이름</label>
        <input className="ts-input" value={name} onChange={(e) => setName(e.target.value)} placeholder="이름" />

        <label className="ts-field-label">직급</label>
        <input className="ts-input" value={position} onChange={(e) => setPosition(e.target.value)} placeholder="예: 대리" />

        {error && <div className="ts-auth-error">{error}</div>}
        {savedFlash && <div className="ts-profile-saved">저장됐어요.</div>}

        <div className="ts-modal-actions">
          <button className="ts-btn ts-btn-start" onClick={handleSave} disabled={!name.trim() || !dirty}>
            저장
          </button>
        </div>
      </div>

      <div className="ts-section-head">
        <h2>비밀번호 변경</h2>
      </div>
      <div className="ts-card ts-profile-card">
        <label className="ts-field-label">현재 비밀번호</label>
        <input className="ts-input" type="password" value={currentPassword} onChange={(e) => setCurrentPassword(e.target.value)} />

        <div className="ts-modal-row">
          <div>
            <label className="ts-field-label">새 비밀번호</label>
            <input className="ts-input" type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} placeholder="4자 이상" />
          </div>
          <div>
            <label className="ts-field-label">새 비밀번호 확인</label>
            <input className="ts-input" type="password" value={newPassword2} onChange={(e) => setNewPassword2(e.target.value)} />
          </div>
        </div>

        {pwError && <div className="ts-auth-error">{pwError}</div>}
        {pwSavedFlash && <div className="ts-profile-saved">비밀번호가 변경됐어요.</div>}

        <div className="ts-modal-actions">
          <button className="ts-btn ts-btn-start" onClick={handleChangePassword} disabled={!pwValid}>
            비밀번호 변경
          </button>
        </div>
      </div>

      <div className="ts-muted">본부, 계정, 관리자 권한 변경은 관리자에게 문의해주세요.</div>
    </div>
  );
}

function TeamTab({
  members,
  currentMember,
  onToggleRole,
  isSuper,
  departments,
  onAddDepartment,
  viewingDepartmentId,
  setViewingDepartmentId,
  allMembers,
  onReassignDepartment,
  pendingDelete,
  onAskDeleteMember,
  onConfirmDeleteMember,
  onAskDeleteDepartment,
  onCancelDelete,
}) {
  const [newDeptName, setNewDeptName] = useState("");
  const canManageThisDept = currentMember?.role === "super" || (currentMember?.role === "admin" && currentMember.departmentId === viewingDepartmentId);
  const deptAdminCount = members.filter((m) => m.role === "admin").length;

  return (
    <div className="ts-stack">
      {isSuper && (
        <>
          <div className="ts-section-head">
            <h2>본부 관리</h2>
          </div>
          <div className="ts-card ts-new-project-card">
            <div className="ts-muted">최고 관리자는 새 본부를 만들고 모든 본부를 관리할 수 있어요.</div>
            <div className="ts-auth-pin-row">
              <input className="ts-input" placeholder="새 본부 이름" value={newDeptName} onChange={(e) => setNewDeptName(e.target.value)} />
              <button
                className="ts-btn ts-btn-start"
                onClick={() => {
                  onAddDepartment(newDeptName);
                  setNewDeptName("");
                }}
                disabled={!newDeptName.trim()}
              >
                본부 만들기
              </button>
            </div>
            {departments.length > 0 && (
              <div className="ts-filter-row">
                {departments.map((d) => (
                  <span key={d.id} className="ts-dept-chip-wrap">
                    <button
                      className={`ts-filter-chip ${viewingDepartmentId === d.id ? "selected" : ""}`}
                      onClick={() => setViewingDepartmentId(d.id)}
                    >
                      {d.name}
                    </button>
                    <button
                      className="ts-icon-btn ts-dept-delete-btn"
                      onClick={() => onAskDeleteDepartment(d.id)}
                      aria-label={`${d.name} 삭제`}
                      title="본부 삭제"
                    >
                      <Trash2 size={12} />
                    </button>
                  </span>
                ))}
              </div>
            )}
          </div>
        </>
      )}

      {isSuper && (
        <>
          <div className="ts-section-head">
            <h2>전체 팀원 현황</h2>
          </div>
          <div className="ts-card ts-list-card">
            {allMembers.filter((m) => m.role === "super").map((m) => (
              <div className="ts-project-row" key={m.id}>
                <MemberAvatar member={m} size={24} />
                <div className="ts-project-info">
                  <div className="ts-project-name">
                    {m.name}
                    <span className="ts-admin-badge">{ROLE_LABEL[m.role]}</span>
                  </div>
                  <div className="ts-muted ts-project-client">@{m.username} · 본부 없음 (전체 관리)</div>
                </div>
              </div>
            ))}
            {allMembers
              .filter((m) => m.role !== "super")
              .map((m) => (
                <div className="ts-project-row" key={m.id}>
                  <MemberAvatar member={m} size={24} />
                  <div className="ts-project-info">
                    <div className="ts-project-name">
                      {m.name}
                      {m.role !== "member" && <span className="ts-admin-badge">{ROLE_LABEL[m.role]}</span>}
                    </div>
                    <div className="ts-muted ts-project-client">
                      {[m.position, `@${m.username}`].filter(Boolean).join(" · ")}
                    </div>
                  </div>
                  <select
                    className="ts-select ts-dept-reassign"
                    value={m.departmentId || ""}
                    onChange={(e) => onReassignDepartment(m.id, e.target.value)}
                  >
                    {departments.length === 0 && <option value="">본부 없음</option>}
                    {departments.map((d) => (
                      <option key={d.id} value={d.id}>
                        {d.name}
                      </option>
                    ))}
                  </select>
                </div>
              ))}
            {allMembers.length === 0 && <EmptyState label="가입된 계정이 없어요." />}
          </div>
          <div className="ts-muted">본부를 바꾸면 이전 본부에서 가지고 있던 관리자 권한은 초기화돼요.</div>
        </>
      )}

      <div className="ts-section-head">
        <h2>{isSuper ? `${departments.find((d) => d.id === viewingDepartmentId)?.name || "선택한 본부"} 팀원` : "팀원"}</h2>
      </div>
      <div className="ts-card ts-list-card">
        {members.length === 0 ? (
          <EmptyState label="이 본부에 소속된 팀원이 없어요." />
        ) : (
          members.map((m) => {
            const isLastDeptAdmin = m.role === "admin" && deptAdminCount <= 1;
            const confirming = pendingDelete?.type === "member" && pendingDelete.id === m.id;
            return (
              <div className="ts-project-row" key={m.id}>
                <MemberAvatar member={m} size={24} />
                <div className="ts-project-info">
                  <div className="ts-project-name">
                    {m.name}
                    {m.role !== "member" && <span className="ts-admin-badge">{ROLE_LABEL[m.role]}</span>}
                  </div>
                  {(m.position || m.username) && (
                    <div className="ts-muted ts-project-client">{[m.position, m.username && `@${m.username}`].filter(Boolean).join(" · ")}</div>
                  )}
                </div>
                {canManageThisDept && (
                  <button
                    className="ts-today-btn"
                    onClick={() => onToggleRole(m.id)}
                    disabled={isLastDeptAdmin}
                    title={isLastDeptAdmin ? "이 본부의 마지막 관리자는 해제할 수 없어요" : undefined}
                  >
                    {m.role === "admin" ? "관리자 해제" : "관리자로 지정"}
                  </button>
                )}
                {canManageThisDept && m.role !== "super" && (
                  confirming ? (
                    <div className="ts-confirm-row">
                      <button className="ts-icon-btn danger" onClick={() => onConfirmDeleteMember(m.id)} aria-label="삭제 확인">
                        <Check size={14} />
                      </button>
                      <button className="ts-icon-btn" onClick={onCancelDelete} aria-label="삭제 취소">
                        <X size={14} />
                      </button>
                    </div>
                  ) : (
                    <button
                      className="ts-icon-btn"
                      onClick={() => onAskDeleteMember(m.id)}
                      disabled={isLastDeptAdmin}
                      title={isLastDeptAdmin ? "이 본부의 마지막 관리자는 삭제할 수 없어요" : "계정 삭제"}
                      aria-label="계정 삭제"
                    >
                      <Trash2 size={14} />
                    </button>
                  )
                )}
              </div>
            );
          })
        )}
      </div>
      {!canManageThisDept && <div className="ts-muted">본부 관리자만 이 본부의 팀원 권한을 바꿀 수 있어요.</div>}
    </div>
  );
}

function ProjectsTab({
  projects,
  tasks,
  worklogs,
  onOpenDetail,
  newProjectOpen,
  setNewProjectOpen,
  draftProject,
  setDraftProject,
  onAdd,
  pendingDelete,
  onAskDelete,
  onConfirmDelete,
  onCancelDelete,
}) {
  const totalsByProject = useMemo(() => {
    const taskProject = {};
    tasks.forEach((t) => (taskProject[t.id] = t.projectId));
    const map = {};
    worklogs.forEach((w) => {
      const pid = taskProject[w.taskId];
      if (!pid) return;
      map[pid] = (map[pid] || 0) + w.minutes;
    });
    return map;
  }, [tasks, worklogs]);

  return (
    <div className="ts-stack">
      <div className="ts-section-head">
        <h2>프로젝트</h2>
        <button className="ts-add-mini" onClick={() => setNewProjectOpen((v) => !v)} aria-label="프로젝트 추가">
          <Plus size={14} />
        </button>
      </div>

      {newProjectOpen && (
        <div className="ts-card ts-new-project-card">
          <input className="ts-input" placeholder="프로젝트 이름" value={draftProject.name} onChange={(e) => setDraftProject((p) => ({ ...p, name: e.target.value }))} autoFocus />
          <input className="ts-input" placeholder="클라이언트 (선택)" value={draftProject.client} onChange={(e) => setDraftProject((p) => ({ ...p, client: e.target.value }))} />
          <div className="ts-swatches">
            {PALETTE.map((c) => (
              <button key={c} className={`ts-swatch ${draftProject.color === c ? "selected" : ""}`} style={{ background: c }} onClick={() => setDraftProject((p) => ({ ...p, color: c }))} aria-label={`색상 ${c}`} />
            ))}
          </div>
          <div className="ts-modal-actions">
            <button className="ts-btn ts-btn-ghost" onClick={() => setNewProjectOpen(false)}>
              취소
            </button>
            <button className="ts-btn ts-btn-start" onClick={onAdd} disabled={!draftProject.name.trim()}>
              프로젝트 추가
            </button>
          </div>
        </div>
      )}

      <div className="ts-card ts-list-card">
        {projects.length === 0 ? (
          <EmptyState label="아직 프로젝트가 없어요. 추가해서 업무를 만들어보세요." />
        ) : (
          projects.map((p) => {
            const confirming = pendingDelete?.type === "project" && pendingDelete.id === p.id;
            return (
              <div className="ts-project-row ts-project-row-clickable" key={p.id} onClick={() => onOpenDetail(p.id)} role="button" tabIndex={0}>
                <span className="ts-dot" style={{ background: p.color }} />
                <div className="ts-project-info">
                  <div className="ts-project-name">{p.name}</div>
                  {p.client && <div className="ts-muted ts-project-client">{p.client}</div>}
                </div>
                <div className="ts-project-total">{fmtHM(totalsByProject[p.id] || 0)}</div>
                {confirming ? (
                  <div className="ts-confirm-row" onClick={(e) => e.stopPropagation()}>
                    <button className="ts-icon-btn danger" onClick={() => onConfirmDelete(p.id)} aria-label="삭제 확인">
                      <Check size={14} />
                    </button>
                    <button className="ts-icon-btn" onClick={onCancelDelete} aria-label="삭제 취소">
                      <X size={14} />
                    </button>
                  </div>
                ) : (
                  <button
                    className="ts-icon-btn"
                    onClick={(e) => {
                      e.stopPropagation();
                      onAskDelete(p.id);
                    }}
                    aria-label="프로젝트 삭제"
                  >
                    <Trash2 size={14} />
                  </button>
                )}
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

function EmptyState({ label, small }) {
  return <div className={`ts-empty ${small ? "small" : ""}`}>{label}</div>;
}

function TaskModal({ modal, projects, members, isAdmin, onClose, onSave }) {
  const { task } = modal;
  const [title, setTitle] = useState(task.title || "");
  const [projectId, setProjectId] = useState(task.projectId || projects[0]?.id || "");
  const [assigneeId] = useState(task.assigneeId || members[0]?.id || ""); // 담당자는 관리자만 변경 가능
  const [status, setStatus] = useState(task.status || "todo");
  const [priority, setPriority] = useState(task.priority || "medium");
  const memberById = useMemo(() => {
    const map = {};
    members.forEach((m) => (map[m.id] = m));
    return map;
  }, [members]);
  const [adminAssigneeId, setAdminAssigneeId] = useState(assigneeId);

  function handleSave() {
    if (!title.trim()) return;
    onSave({ ...task, title: title.trim(), projectId, assigneeId: isAdmin ? adminAssigneeId : assigneeId, status, priority });
  }

  return (
    <div className="ts-modal-backdrop" onClick={onClose}>
      <div className="ts-modal" onClick={(e) => e.stopPropagation()}>
        <div className="ts-modal-head">
          <h3>{modal.mode === "create" ? "새 업무" : "업무 수정"}</h3>
          <button className="ts-icon-btn" onClick={onClose} aria-label="닫기">
            <X size={16} />
          </button>
        </div>

        <label className="ts-field-label">제목</label>
        <input className="ts-input" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="예: 결제 페이지 QA" autoFocus />

        <div className="ts-modal-row">
          <div>
            <label className="ts-field-label">프로젝트</label>
            <select className="ts-select ts-select-full" value={projectId} onChange={(e) => setProjectId(e.target.value)}>
              {projects.map((p) => (
                <option key={p.id} value={p.id}>
                  {p.name}
                </option>
              ))}
            </select>
          </div>
          <div>
            <label className="ts-field-label">담당자</label>
            {isAdmin ? (
              <select className="ts-select ts-select-full" value={adminAssigneeId} onChange={(e) => setAdminAssigneeId(e.target.value)}>
                {members.map((m) => (
                  <option key={m.id} value={m.id}>
                    {m.name}
                  </option>
                ))}
              </select>
            ) : (
              <div className="ts-locked-field">
                <MemberAvatar member={memberById[assigneeId]} size={20} />
                {memberById[assigneeId]?.name || "미배정"}
              </div>
            )}
          </div>
        </div>
        {!isAdmin && <div className="ts-muted">담당자는 관리자만 지정하거나 바꿀 수 있어요.</div>}

        <label className="ts-field-label">상태</label>
        <div className="ts-segmented">
          {STATUS_ORDER.map((s) => (
            <button key={s} type="button" className={`ts-segmented-btn ${status === s ? "selected" : ""}`} onClick={() => setStatus(s)}>
              {STATUS_LABEL[s]}
            </button>
          ))}
        </div>

        <label className="ts-field-label">우선순위</label>
        <div className="ts-segmented">
          {["low", "medium", "high"].map((p) => (
            <button key={p} type="button" className={`ts-segmented-btn ${priority === p ? "selected" : ""}`} onClick={() => setPriority(p)}>
              {PRIORITY_LABEL[p]}
            </button>
          ))}
        </div>

        <div className="ts-modal-actions">
          <button className="ts-btn ts-btn-ghost" onClick={onClose}>
            취소
          </button>
          <button className="ts-btn ts-btn-start" onClick={handleSave} disabled={!title.trim() || !projectId || !assigneeId}>
            저장
          </button>
        </div>
      </div>
    </div>
  );
}

function WorklogModal({ modal, tasks, projects, projectById, session, currentMember, onClose, onSave, onDelete }) {
  const { worklog } = modal;
  const [confirmingDelete, setConfirmingDelete] = useState(false);
  const initialTask = tasks.find((t) => t.id === worklog.taskId);
  const [projectId, setProjectId] = useState(initialTask?.projectId || projects[0]?.id || "");
  const [taskId, setTaskId] = useState(worklog.taskId || "");
  const [date, setDate] = useState(worklog.dateKey);
  const [startMinutes, setStartMinutes] = useState(worklog.startMinutes ?? 540);
  const [endMinutes, setEndMinutes] = useState(worklog.endMinutes ?? (worklog.startMinutes ?? 540) + (worklog.minutes || 60));
  const [note, setNote] = useState(worklog.note || "");

  const tasksInProject = useMemo(() => tasks.filter((t) => t.projectId === projectId), [tasks, projectId]);

  function handleProjectChange(newProjectId) {
    setProjectId(newProjectId);
    const stillValid = taskId && tasks.find((t) => t.id === taskId)?.projectId === newProjectId;
    if (!stillValid) {
      const firstTask = tasks.find((t) => t.projectId === newProjectId);
      setTaskId(firstTask?.id || "");
    }
  }

  const duration = endMinutes - startMinutes;
  const valid = duration > 0;

  function handleStartChange(v) {
    const next = Number(v);
    setStartMinutes(next);
    if (endMinutes <= next) setEndMinutes(Math.min(1430, next + 10));
  }

  function handleSave() {
    if (!valid || !taskId) return;
    onSave({ ...worklog, taskId, memberId: session, dateKey: date, startMinutes, endMinutes, minutes: duration, note: note.trim() });
  }

  return (
    <div className="ts-modal-backdrop" onClick={onClose}>
      <div className="ts-modal" onClick={(e) => e.stopPropagation()}>
        <div className="ts-modal-head">
          <h3>{modal.mode === "create" ? "시간 기록" : "기록 수정"}</h3>
          <button className="ts-icon-btn" onClick={onClose} aria-label="닫기">
            <X size={16} />
          </button>
        </div>

        <div className="ts-timer-who">
          <MemberAvatar member={currentMember} size={22} />
          <span>{currentMember?.name}님의 기록으로 저장돼요</span>
        </div>

        <label className="ts-field-label">프로젝트</label>
        <select className="ts-select ts-select-full" value={projectId} onChange={(e) => handleProjectChange(e.target.value)}>
          {projects.length === 0 && <option value="">프로젝트 없음</option>}
          {projects.map((p) => (
            <option key={p.id} value={p.id}>
              {p.name}
            </option>
          ))}
        </select>

        <label className="ts-field-label">세부업무</label>
        <select className="ts-select ts-select-full" value={taskId} onChange={(e) => setTaskId(e.target.value)} disabled={tasksInProject.length === 0}>
          {tasksInProject.length === 0 && <option value="">이 프로젝트에 등록된 업무가 없어요</option>}
          {tasksInProject.map((t) => (
            <option key={t.id} value={t.id}>
              {t.title}
            </option>
          ))}
        </select>
        <div className="ts-muted">담당자가 아니어도 이 업무에 시간을 기록할 수 있어요.</div>

        <label className="ts-field-label">날짜</label>
        <input className="ts-input" type="date" value={date} onChange={(e) => setDate(e.target.value)} />

        <div className="ts-modal-row">
          <div>
            <label className="ts-field-label">시작</label>
            <select className="ts-select ts-select-full" value={startMinutes} onChange={(e) => handleStartChange(e.target.value)}>
              {TIME_OPTIONS.map((m) => (
                <option key={m} value={m}>
                  {fmtTime(m)}
                </option>
              ))}
            </select>
          </div>
          <div>
            <label className="ts-field-label">종료</label>
            <select className="ts-select ts-select-full" value={endMinutes} onChange={(e) => setEndMinutes(Number(e.target.value))}>
              {TIME_OPTIONS.map((m) => (
                <option key={m} value={m}>
                  {fmtTime(m)}
                </option>
              ))}
            </select>
          </div>
        </div>

        {valid ? (
          <div className="ts-muted">총 {fmtHM(duration)} 기록돼요</div>
        ) : (
          <div className="ts-auth-error">종료 시간은 시작 시간보다 늦어야 해요.</div>
        )}

        <label className="ts-field-label">메모 (선택)</label>
        <input className="ts-input" value={note} onChange={(e) => setNote(e.target.value)} placeholder="예: PR 리뷰까지 완료" />

        <div className="ts-modal-actions ts-modal-actions-with-delete">
          {modal.mode === "edit" && onDelete ? (
            <div className="ts-modal-delete">
              {confirmingDelete ? (
                <>
                  <span className="ts-muted">삭제할까요?</span>
                  <button className="ts-icon-btn danger" onClick={() => onDelete(worklog.id)} aria-label="삭제 확인">
                    <Check size={14} />
                  </button>
                  <button className="ts-icon-btn" onClick={() => setConfirmingDelete(false)} aria-label="삭제 취소">
                    <X size={14} />
                  </button>
                </>
              ) : (
                <button className="ts-icon-btn" onClick={() => setConfirmingDelete(true)} aria-label="기록 삭제">
                  <Trash2 size={14} />
                </button>
              )}
            </div>
          ) : (
            <span />
          )}
          <div className="ts-modal-actions-right">
            <button className="ts-btn ts-btn-ghost" onClick={onClose}>
              취소
            </button>
            <button className="ts-btn ts-btn-start" onClick={handleSave} disabled={!taskId || !valid}>
              저장
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function EventModal({ modal, session, currentMember, members, memberById, onClose, onSave, onDelete }) {
  const { event } = modal;
  const [confirmingDelete, setConfirmingDelete] = useState(false);
  const [categoryId, setCategoryId] = useState(event.categoryId || EVENT_CATEGORIES[0].id);
  const [title, setTitle] = useState(event.title || "");
  const [allDay, setAllDay] = useState(!!event.allDay);
  const [date, setDate] = useState(event.dateKey);
  const [endDate, setEndDate] = useState(event.endDateKey || event.dateKey);
  const [startMinutes, setStartMinutes] = useState(event.startMinutes ?? 600);
  const [endMinutes, setEndMinutes] = useState(event.endMinutes ?? (event.startMinutes ?? 600) + 60);
  const [note, setNote] = useState(event.note || "");
  const [participantIds, setParticipantIds] = useState(event.participantIds || []);

  const duration = endMinutes - startMinutes;
  const timeValid = allDay || duration > 0;
  const dateValid = !allDay || endDate >= date;
  const valid = timeValid && dateValid;

  function toggleParticipant(id) {
    setParticipantIds((prev) => (prev.includes(id) ? prev.filter((p) => p !== id) : [...prev, id]));
  }

  function handleStartChange(v) {
    const next = Number(v);
    setStartMinutes(next);
    if (endMinutes <= next) setEndMinutes(Math.min(1430, next + 10));
  }

  function handleSave() {
    if (!valid || !title.trim()) return;
    if (allDay) {
      onSave({ ...event, categoryId, title: title.trim(), memberId: session, dateKey: date, endDateKey: endDate, allDay: true, startMinutes: undefined, endMinutes: undefined, note: note.trim(), participantIds });
    } else {
      onSave({ ...event, categoryId, title: title.trim(), memberId: session, dateKey: date, endDateKey: undefined, allDay: false, startMinutes, endMinutes, note: note.trim(), participantIds });
    }
  }

  const otherMembers = members.filter((m) => m.id !== session);

  return (
    <div className="ts-modal-backdrop" onClick={onClose}>
      <div className="ts-modal" onClick={(e) => e.stopPropagation()}>
        <div className="ts-modal-head">

          <button className="ts-icon-btn" onClick={onClose} aria-label="닫기">
            <X size={16} />
          </button>
        </div>

        <div className="ts-timer-who">
          <MemberAvatar member={currentMember} size={22} />
          <span>{currentMember?.name}님의 기록으로 저장돼요 · 본부 전체에 공유돼요</span>
        </div>

        <label className="ts-field-label">구분</label>
        <div className="ts-segmented ts-cat-segmented">
          {EVENT_CATEGORIES.map((c) => (
            <button
              key={c.id}
              type="button"
              className={`ts-segmented-btn ${categoryId === c.id ? "selected" : ""}`}
              style={categoryId === c.id ? { background: c.color + "22", color: c.color } : {}}
              onClick={() => setCategoryId(c.id)}

              {c.label}
            </button>
          ))}
        </div>

        <label className="ts-field-label">제목</label>
        <input className="ts-input" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="예: OO현장 실시설계 협의" autoFocus />

        <div className="ts-segmented ts-allday-toggle">
          <button type="button" className={`ts-segmented-btn ${!allDay ? "selected" : ""}`} onClick={() => setAllDay(false)}>
            시간 지정
          </button>
          <button type="button" className={`ts-segmented-btn ${allDay ? "selected" : ""}`} onClick={() => setAllDay(true)}>
            종일 (일단위)
          </button>
        </div>

        {allDay ? (
          <div className="ts-modal-row">
            <div>
              <label className="ts-field-label">시작일</label>
              <input className="ts-input" type="date" value={date} onChange={(e) => setDate(e.target.value)} />
            </div>
            <div>
              <label className="ts-field-label">종료일</label>
              <input className="ts-input" type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} />

        ) : (
          <>

            <input className="ts-input" type="date" value={date} onChange={(e) => setDate(e.target.value)} />

            <div className="ts-modal-row">
              <div>

                <select className="ts-select ts-select-full" value={startMinutes} onChange={(e) => handleStartChange(e.target.value)}>

                    <option key={m} value={m}>

        {valid && !allDay && <div className="ts-muted">총 {fmtHM(duration)} 일정이에요</div>}
        {valid && allDay && <div className="ts-muted">총 {dateRangeDays(date, endDate)}일간 종일 일정이에요</div>}

        <label className="ts-field-label">참여자 (선택)</label>

        <div className="ts-modal-actions ts-modal-actions-with-delete">
          {modal.mode === "edit" && onDelete ? (
            <div className="ts-modal-delete">
              {confirmingDelete ? (
                <>
                  <span className="ts-muted">삭제할까요?</span>
                  <button className="ts-icon-btn danger" onClick={() => onDelete(event.id)} aria-label="삭제 확인">
                    <Check size={14} />
                  </button>
                  <button className="ts-icon-btn" onClick={() => setConfirmingDelete(false)} aria-label="삭제 취소">
                    <X size={14} />
                  </button>
                </>
              ) : (
                <button className="ts-icon-btn" onClick={() => setConfirmingDelete(true)} aria-label="이벤트 삭제">
                  <Trash2 size={14} />
                </button>
              )}
            </div>
          ) : (
            <span />
          )}
          <div className="ts-modal-actions-right">
            <button className="ts-btn ts-btn-ghost" onClick={onClose}>
              취소
            </button>
            <button className="ts-btn ts-btn-start" onClick={handleSave} disabled={!title.trim() || !valid}>
              저장
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ScheduleTab({ leaves, members, memberById, session, onNew, onEdit }) {
  const [filterMemberId, setFilterMemberId] = useState(null);
  const todayKey = toKey(new Date());

  const filtered = filterMemberId ? leaves.filter((l) => l.memberId === filterMemberId) : leaves;

  const todayList = filtered.filter((l) => todayKey >= l.startDateKey && todayKey <= l.endDateKey);

  const sorted = [...filtered].sort((a, b) => (a.startDateKey < b.startDateKey ? 1 : -1));
  const upcoming = sorted.filter((l) => l.endDateKey >= todayKey);
  const past = sorted.filter((l) => l.endDateKey < todayKey);

  function rangeLabel(l) {
    const days = dateRangeDays(l.startDateKey, l.endDateKey);
    if (l.startDateKey === l.endDateKey) return `${monthDay(parseDateKey(l.startDateKey))} (${days}일)`;
    return `${monthDay(parseDateKey(l.startDateKey))} – ${monthDay(parseDateKey(l.endDateKey))} (${days}일)`;
  }

  function LeaveRow({ l }) {
    const member = memberById[l.memberId];
    const type = LEAVE_TYPE_BY_ID[l.typeId] || LEAVE_TYPES[LEAVE_TYPES.length - 1];
    const own = l.memberId === session;
    return (
      <div className="ts-entry-row">
        <MemberAvatar member={member} size={24} />
        <div className="ts-entry-info" onClick={own ? () => onEdit(l) : undefined} role={own ? "button" : undefined} tabIndex={own ? 0 : undefined} style={{ cursor: own ? "pointer" : "default" }}>
          <div className="ts-entry-desc">
            <span className="ts-leave-type-badge" style={{ background: type.color + "22", color: type.color }}>
              {type.label}
            </span>{" "}
            {member?.name || "삭제된 팀원"}
          </div>
          <div className="ts-muted ts-entry-project">
            {rangeLabel(l)}
            {l.note && ` · ${l.note}`}
          </div>
        </div>
        {own && (
          <button className="ts-icon-btn" onClick={() => onEdit(l)} aria-label="일정 수정">
            <Pencil size={13} />
          </button>
        )}
      </div>
    );
  }

  return (
    <div className="ts-stack">
      <div className="ts-section-head">
        <h2>휴가 · 출장 일정</h2>
        <button className="ts-btn ts-btn-start ts-btn-small" onClick={onNew}>
          <Plus size={14} />
          일정 등록
        </button>
      </div>

      {members.length > 0 && (
        <div className="ts-filter-row">
          <button className={`ts-filter-chip ${filterMemberId === null ? "selected" : ""}`} onClick={() => setFilterMemberId(null)}>
            전체
          </button>
          {members.map((m) => (
            <button
              key={m.id}
              className={`ts-filter-chip ${filterMemberId === m.id ? "selected" : ""}`}
              style={filterMemberId === m.id ? { background: m.color + "22", color: m.color, borderColor: m.color + "55" } : {}}
              onClick={() => setFilterMemberId(m.id)}
            >
              {m.name}
            </button>
          ))}
        </div>
      )}

      <div className="ts-section-head">
        <h2>오늘 휴가 · 출장 중</h2>
      </div>
      <div className="ts-card ts-list-card">
        {todayList.length === 0 ? (
          <EmptyState label="오늘 휴가·출장 중인 팀원이 없어요." small />
        ) : (
          todayList.map((l) => <LeaveRow key={l.id} l={l} />)
        )}
      </div>

      <div className="ts-section-head">
        <h2>예정된 일정</h2>
      </div>
      <div className="ts-card ts-list-card">
        {upcoming.length === 0 ? <EmptyState label="예정된 휴가·출장이 없어요." /> : upcoming.map((l) => <LeaveRow key={l.id} l={l} />)}
      </div>

      {past.length > 0 && (
        <>
          <div className="ts-section-head">
            <h2>지난 일정</h2>
          </div>
          <div className="ts-card ts-list-card">
            {past.map((l) => (
              <LeaveRow key={l.id} l={l} />
            ))}
          </div>
        </>
      )}
    </div>
  );
}

        display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;

      .ts-nav-desktop { display: flex; gap: 4px; }
      .ts-nav-btn { border: none; background: transparent; color: var(--ink-muted); font-weight: 600; font-size: 13.5px; padding: 7px 14px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }

      .ts-nav-btn.active { background: var(--accent-soft); color: var(--accent-dark); }
      .ts-header-user { display: flex; align-items: center; gap: 8px; }
      .ts-dept-switch { max-width: 180px; padding: 7px 10px; font-size: 12.5px; }
      .ts-dept-reassign { max-width: 150px; padding: 6px 8px; font-size: 12px; flex-shrink: 0; }
      .ts-dept-badge { background: var(--surface-alt); color: var(--ink-muted); font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 20px; }

      .ts-main { max-width: 760px; margin: 0 auto; padding: 20px; }
      .ts-stack { display: flex; flex-direction: column; gap: 22px; }
