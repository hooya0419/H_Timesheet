      .ts-status-col { display: flex; flex-direction: column; gap: 10px; }

      .ts-project-status-summary { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .ts-status-count-chip {
        background: var(--surface-alt); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px;
        font-size: 11.5px; font-weight: 600; color: var(--ink-muted);
      }
      .ts-status-count-chip b { color: var(--ink); font-weight: 700; margin-left: 3px; }
      .ts-project-toggle-chip { display: inline-flex; align-items: center; gap: 6px; }

      .ts-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }

      .ts-input, .ts-select {
        font-family: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
        background: var(--surface-alt); color: var(--ink); outline: none; transition: border-color 0.15s;
      }
      .ts-input:focus, .ts-select:focus { border-color: var(--accent); background: var(--surface); }

      .ts-btn {
        display: inline-flex; align-items: center; gap: 7px; border: none; border-radius: 9px;
        font-family: inherit; font-weight: 600; font-size: 14px; padding: 11px 20px; cursor: pointer; transition: transform 0.1s, opacity 0.15s;
      }
      .ts-btn:active { transform: scale(0.97); }
      .ts-btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .ts-btn-start { background: var(--accent); color: #fff; }
      .ts-btn-start:hover:not(:disabled) { background: var(--accent-dark); }
      .ts-btn-ghost { background: transparent; color: var(--ink-muted); }
      .ts-btn-ghost:hover { color: var(--ink); }
      .ts-btn-danger-solid { background: var(--accent-dark); color: #fff; }
      .ts-btn-small { padding: 7px 14px; font-size: 13px; }

      .ts-section-head { display: flex; align-items: center; justify-content: space-between; }
      .ts-section-head h2 { font-size: 14.5px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; color: var(--ink); }
      .ts-col-count { color: var(--ink-muted); font-weight: 600; font-size: 12px; background: var(--surface-alt); padding: 1px 7px; border-radius: 20px; }
      .ts-today-tag { background: var(--accent-soft); color: var(--accent-dark); font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 20px; }
      .ts-muted { color: var(--ink-muted); font-size: 12.5px; }
      .ts-board-head-actions { display: flex; align-items: center; gap: 8px; }

      .ts-add-mini { width: 24px; height: 24px; border-radius: 50%; border: 1px dashed var(--border); background: var(--surface); color: var(--ink-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; }
      .ts-add-mini:hover { border-color: var(--accent); color: var(--accent); }

      .ts-list-card { padding: 6px 18px; }
      .ts-entry-row, .ts-project-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
      .ts-entry-row:last-child, .ts-project-row:last-child { border-bottom: none; }
      .ts-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
      .ts-dot-inline { display: inline-block; margin-right: 5px; vertical-align: middle; }
      .ts-avatar { border-radius: 50%; flex-shrink: 0; color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; }
      .ts-entry-info { flex: 1; min-width: 0; }
      .ts-entry-desc { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ts-entry-project { margin-top: 2px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ts-time-range { font-variant-numeric: tabular-nums; margin-right: 5px; }
      .ts-entry-time { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13.5px; flex-shrink: 0; }
      .ts-entry-actions { display: flex; gap: 2px; flex-shrink: 0; }
      .ts-entry-actions-spacer { width: 4px; flex-shrink: 0; }
      .ts-confirm-row { display: flex; gap: 4px; flex-shrink: 0; }

      .ts-icon-btn { width: 26px; height: 26px; border-radius: 6px; border: none; background: transparent; color: var(--ink-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; }
      .ts-icon-btn:hover { background: var(--surface-alt); color: var(--ink); }
      .ts-icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
      .ts-icon-btn.danger { background: #FDE4DC; color: var(--accent-dark); }
      .ts-icon-btn.danger:hover { background: var(--accent-soft); }

      .ts-empty { padding: 24px 4px; text-align: center; color: var(--ink-muted); font-size: 13px; }
      .ts-empty.small { padding: 16px 4px; }

      .ts-week-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
      .ts-week-label { font-weight: 600; font-size: 15px; flex: 1; }
      .ts-today-btn { border: 1px solid var(--border); background: var(--surface-alt); color: var(--ink-muted); font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 7px; cursor: pointer; }
      .ts-today-btn:hover { color: var(--ink); }
      .ts-today-btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .ts-jump-input {
        border: 1px solid var(--border); background: var(--surface-alt); color: var(--ink); font-family: inherit;
        font-size: 12px; font-weight: 600; padding: 5px 8px; border-radius: 7px; cursor: pointer; outline: none;
      }
      .ts-jump-input:focus { border-color: var(--accent); }

      .ts-view-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
      .ts-view-toggle-row .ts-view-toggle { margin-bottom: 0; }
      .ts-view-toggle { display: inline-flex; gap: 4px; background: var(--surface-alt); padding: 3px; border-radius: 9px; margin-bottom: 14px; }
      .ts-color-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
      .ts-color-legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--ink-muted); }
      .ts-view-toggle button { border: none; background: transparent; padding: 6px 14px; border-radius: 7px; font-weight: 600; font-size: 12.5px; color: var(--ink-muted); cursor: pointer; font-family: inherit; }
      .ts-view-toggle button.selected { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

      .ts-filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
      .ts-filter-chip { border: 1px solid var(--border); background: var(--surface-alt); color: var(--ink-muted); font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 20px; cursor: pointer; transition: all 0.15s; }
      .ts-filter-chip.selected { background: var(--accent-soft); color: var(--accent-dark); border-color: transparent; }
      .ts-dept-chip-wrap { display: inline-flex; align-items: center; gap: 2px; }
      .ts-dept-delete-btn { width: 20px; height: 20px; color: var(--ink-muted); }
      .ts-dept-delete-btn:hover { background: #FDE4DC; color: var(--accent-dark); }

      .ts-cal-summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
      .ts-cal-summary-actions { display: flex; gap: 8px; }
      .ts-btn-outline { border: 1px solid var(--border); }
      .ts-btn-outline:hover { border-color: var(--accent); color: var(--accent-dark); }

      .ts-cal-scroll { max-height: 560px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
      .ts-cal-body { position: relative; display: flex; }
      .ts-cal-labels { width: 46px; flex-shrink: 0; position: relative; }
      .ts-cal-label { position: absolute; left: 0; right: 8px; text-align: right; font-size: 10px; color: var(--ink-muted); transform: translateY(-6px); }
      .ts-cal-lines { flex: 1; position: relative; border-left: 1px solid var(--border); }
      .ts-cal-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); }
      .ts-cal-empty { position: absolute; top: 40%; left: 0; right: 0; }
      .ts-cal-event {
        position: absolute; border: none; border-left: 3px solid; border-radius: 6px; padding: 4px 7px;
        overflow: hidden; text-align: left; font-family: inherit; color: var(--ink); cursor: default;
      }
      .ts-cal-event.own { cursor: pointer; }
      .ts-cal-event.own:hover { filter: brightness(0.97); }
      .ts-cal-event-title { display: block; font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ts-cal-event-time { display: block; font-size: 10px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ts-cal-event-type-event { border-left-style: dashed; }
      .ts-cal-event-cat { font-weight: 700; }
      .ts-dot-event { background: repeating-linear-gradient(135deg, #9A968D, #9A968D 2px, #fff 2px, #fff 4px); border: 1px solid #9A968D; }

      .ts-week-outer { overflow-x: auto; }
      .ts-week-inner { min-width: 640px; }
      .ts-week-header-row { display: flex; margin-bottom: 8px; }
      .ts-week-header-spacer { width: 46px; flex-shrink: 0; }
      .ts-week-header-day { flex: 1; text-align: center; padding: 6px 2px; border-radius: 8px; }
      .ts-week-header-day.today { background: var(--accent-soft); }
      .ts-week-header-dow { display: block; font-size: 10px; color: var(--ink-muted); font-weight: 600; }
      .ts-week-header-num { display: block; font-size: 13px; font-weight: 700; margin-top: 2px; }
      .ts-week-header-day.today .ts-week-header-num { color: var(--accent-dark); }
      .ts-week-days-grid { flex: 1; display: flex; }
      .ts-week-allday-row { display: flex; gap: 4px; margin-bottom: 8px; }
      .ts-week-allday-col { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }

      .ts-allday-block { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 10px 12px; }
      .ts-allday-block-label {
        display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--ink-muted);
        text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 8px;
      }
      .ts-allday-strip { display: flex; flex-wrap: wrap; gap: 6px; }
      .ts-allday-chip {
        border: 1.5px solid; border-radius: 20px; padding: 6px 12px; font-family: inherit; font-weight: 600; font-size: 12px;
        cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px;
      }
      .ts-allday-chip:not(:disabled) { cursor: pointer; }
      .ts-allday-chip-cat { font-weight: 700; margin-right: 4px; }
      .ts-allday-chip-small { max-width: 100%; padding: 3px 8px; font-size: 10.5px; border-radius: 6px; text-align: left; border-width: 1px; }

      .ts-leave-type-badge { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 20px; margin-right: 2px; }
      .ts-participant-grid { display: flex; flex-wrap: wrap; gap: 6px; }
      .ts-participant-chip {
        display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface-alt);
        color: var(--ink); font-family: inherit; font-weight: 600; font-size: 12px; padding: 5px 10px 5px 5px; border-radius: 20px; cursor: pointer;
      }
      .ts-participant-chip.selected { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
      .ts-allday-toggle { margin-bottom: 2px; }
      .ts-week-daycol { flex: 1; position: relative; border-left: 1px solid var(--border); }
      .ts-week-event { padding: 3px 5px; }
      .ts-week-event .ts-cal-event-title { font-size: 10.5px; }

      .ts-month-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
      .ts-month-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border); }
      .ts-month-weekday { text-align: center; font-size: 11px; font-weight: 700; color: var(--ink-muted); padding: 8px 0; }
      .ts-month-days { display: grid; grid-template-columns: repeat(7, 1fr); }
      .ts-month-cell {
        border: none; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--surface);
        min-height: 86px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 6px;
        cursor: pointer; font-family: inherit; text-align: left;
      }
      .ts-month-cell:hover { background: var(--surface-alt); }
      .ts-month-cell.muted { background: var(--surface-alt); opacity: 0.55; }
      .ts-month-daynum { font-size: 11.5px; font-weight: 600; color: var(--ink); width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
      .ts-month-daynum.today { background: var(--accent); color: #fff; }
      .ts-month-daytotal { font-size: 10px; font-weight: 700; color: var(--accent-dark); font-variant-numeric: tabular-nums; }
      .ts-month-dots { display: flex; gap: 3px; }
      .ts-month-events { display: flex; flex-direction: column; gap: 2px; width: 100%; margin-top: auto; }
      .ts-month-event-chip {
        font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; width: 100%; box-sizing: border-box;
      }
      .ts-month-event-more { font-size: 9.5px; font-weight: 700; color: var(--ink-muted); }

      .ts-progress-track { width: 140px; height: 6px; background: var(--surface-alt); border-radius: 4px; overflow: hidden; }
      .ts-progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.25s ease; }

      .ts-progress-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
      .ts-progress-row:last-child { border-bottom: none; }
      .ts-progress-row:hover { background: var(--surface-alt); margin: 0 -18px; padding: 12px 18px; border-radius: 8px; }
      .ts-progress-pct-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
      .ts-progress-pct-num { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; width: 34px; text-align: right; }

      .ts-project-info { flex: 1; min-width: 0; }
      .ts-project-row-clickable { cursor: pointer; }
      .ts-project-row-clickable:hover { background: var(--surface-alt); margin: 0 -18px; padding: 12px 18px; border-radius: 8px; }
      .ts-project-name { font-size: 13.5px; font-weight: 600; }
      .ts-project-client { margin-top: 1px; }
      .ts-project-total { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; color: var(--ink-muted); flex-shrink: 0; }

      .ts-new-project-card { display: flex; flex-direction: column; gap: 10px; }

      .ts-swatch.selected { border-color: var(--ink); box-shadow: 0 0 0 2px var(--surface); }

      .ts-modal-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 4px; }

      .ts-modal-actions-right { display: flex; gap: 8px; }
      .ts-modal-delete { display: flex; align-items: center; gap: 6px; }

      .ts-task-card { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; }

      .ts-task-meta { margin-top: 4px; display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-muted); flex-wrap: wrap; }

      .ts-priority-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; flex-shrink: 0; white-space: nowrap; }

      .ts-status-toggle { gap: 5px; flex-wrap: wrap; }

      .ts-time-chip {
        display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); background: var(--surface-alt);
        color: var(--ink); font-family: inherit; font-weight: 600; font-size: 12px; padding: 5px 10px; border-radius: 20px; cursor: pointer;
        font-variant-numeric: tabular-nums;

      .ts-task-actions { display: flex; gap: 2px; margin-left: auto; }

      .ts-segmented { display: flex; gap: 6px; }

      .ts-segmented-btn {
        flex: 1; border: 1px solid var(--border); background: var(--surface-alt); color: var(--ink-muted);
        font-family: inherit; font-weight: 600; font-size: 12.5px; padding: 8px 0; border-radius: 8px; cursor: pointer; transition: all 0.15s;
      }

      .ts-field-label { font-size: 11.5px; font-weight: 600; color: var(--ink-muted); margin-top: 4px; }

      }
      .ts-admin-badge {
        display: inline-block; margin-left: 6px; background: var(--accent-soft); color: var(--accent-dark);
        font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 20px; vertical-align: middle;

      .ts-auth-body { display: flex; flex-direction: column; gap: 10px; }
      .ts-auth-member-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .ts-auth-member { display: flex; flex-direction: column; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface-alt); border-radius: 12px; padding: 12px 6px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink); }
      .ts-auth-member.selected { border-color: var(--accent); background: var(--accent-soft); }
      .ts-auth-pin-row { display: flex; gap: 8px; margin-top: 6px; }
      .ts-auth-pin-row .ts-input { flex: 1; }
      .ts-auth-error { color: var(--accent-dark); font-size: 12.5px; font-weight: 600; }
      .ts-auth-submit { margin-top: 6px; justify-content: center; }
      .ts-auth-note { color: var(--ink-muted); font-size: 11px; margin: 18px 0 0; line-height: 1.5; }

      .ts-project-detail-backdrop { z-index: 45; }
      .ts-project-detail-modal { max-width: 560px; }
      .ts-project-detail-title { display: flex; align-items: center; gap: 8px; }
      .ts-project-detail-title h3 { margin: 0; }
      .ts-project-detail-add { align-self: flex-start; margin: 4px 0 6px; }

      @media (min-width: 640px) {
        .ts-modal-backdrop { align-items: center; }
        .ts-modal { border-radius: 16px; }
      }

      @media (max-width: 720px) {
        .ts-nav-desktop { display: none; }
        .ts-header { padding: 12px 16px; }
        .ts-header-username { display: none; }
        .ts-main { padding: 14px 14px 92px; }
        .ts-nav-mobile {
          display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
          background: var(--surface); border-top: 1px solid var(--border); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
        }
        .ts-nav-mobile-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; border: none; background: transparent; color: var(--ink-muted); padding: 6px 0; border-radius: 10px; font-size: 10px; font-weight: 600; cursor: pointer; }
        .ts-nav-mobile-btn.active { color: var(--accent-dark); }
        .ts-auth-card { padding: 22px; }
        .ts-task-bottom { flex-wrap: wrap; }
      }
    `}</style>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TimesheetApp />);
</script>

<script>
  // 위의 text/plain 소스를 classic 런타임으로 직접 변환해서 실행합니다.
  // (automatic 런타임을 쓰면 Babel이 실제 import 구문을 끼워 넣어서
  // 일반 <script>에서 "Cannot use import statement outside a module" 에러가 나요)
  (function () {
    var sourceEl = document.getElementById("app-source");
    var source = sourceEl.textContent;
    var output = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
      filename: "app.jsx",
    }).code;
    var script = document.createElement("script");
    script.text = output;
    document.body.appendChild(script);
  })();
</script>
